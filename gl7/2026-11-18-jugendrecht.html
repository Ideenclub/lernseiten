<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL 7 · Jugend und Kriminalität</title>
<style>
:root{--pl:#4b2a4f;--pl2:#6d4a72;--mi:#2f8f7a;--mil:#e3f2ee;--sa:#f7f3ee;--ink:#1f1b22;--gr:#6b6570;--ok:#2e8b57;--no:#c0392b;--am:#d39b2a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sa);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45}
header{background:var(--pl);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .t{font-weight:700;font-size:17px;flex:1;min-width:200px}
header button{background:transparent;border:2px solid #fff;color:#fff;border-radius:8px;padding:8px 14px;font-size:15px;min-height:44px;cursor:pointer}
.bar{height:6px;background:#e4dce6}.bar div{height:100%;background:var(--mi);width:0;transition:width .3s}
main{max-width:920px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border-radius:10px;padding:20px 22px;margin:14px 0;border:1px solid #e6dfe8}
h1{font-size:27px;margin:4px 0 8px;color:var(--pl)}
h2{font-size:23px;margin:0 0 10px;color:var(--pl)}
h3{font-size:19px;margin:16px 0 8px}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mi);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:9px;border:2px solid var(--pl);background:var(--pl);color:#fff;font-size:17px;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:#fff;color:var(--pl)}
.btn.mint{background:var(--mi);border-color:var(--mi)}
.btn:disabled{opacity:.45;cursor:default}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin:8px 0;border-radius:9px;border:2px solid #d9d0dc;background:#fff;font-size:17px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--pl);background:#f3edf4}
.opt.right{border-color:var(--ok);background:#e8f5ee}
.opt.wrong{border-color:var(--no);background:#fbeaea}
.fb{margin-top:10px;padding:12px 14px;border-radius:9px;display:none;font-size:16.5px}
.fb.ok{display:block;background:#e8f5ee;border-left:5px solid var(--ok)}
.fb.no{display:block;background:#fbeaea;border-left:5px solid var(--no)}
.fb.info{display:block;background:var(--mil);border-left:5px solid var(--mi)}
.book{border-left:6px solid var(--pl);background:#f3edf4;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0 12px;font-size:16.5px}
.book b{color:var(--pl)}
.heft{border:2px dashed var(--mi);padding:12px 14px;border-radius:9px;margin:12px 0;background:#fbfffd}
details{margin-top:8px}summary{cursor:pointer;color:var(--mi);font-weight:700;min-height:40px;display:flex;align-items:center}
.tipp{background:#fff8e8;border-left:5px solid var(--am);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
img.ph{width:100%;border-radius:8px;display:block}
.cap{font-size:13px;color:var(--gr);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{min-height:48px;padding:10px 14px;border-radius:24px;border:2px solid #cfc4d3;background:#fff;font-size:16px;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--pl);background:var(--pl);color:#fff}
.chip.done{opacity:.35}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.cat{border:2px solid var(--pl2);border-radius:10px;padding:10px;min-height:110px;background:#fbf9fc;cursor:pointer}
.cat .ch{font-weight:700;color:var(--pl);margin-bottom:6px}
.cat .it{font-size:15px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:5px 8px;margin:4px 0}
.cat .it.right{border-color:var(--ok);background:#e8f5ee}.cat .it.wrong{border-color:var(--no);background:#fbeaea}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.prog span{font-size:13px;padding:4px 9px;border-radius:12px;background:#ece5ee;color:var(--gr)}
.prog span.on{background:var(--pl);color:#fff}.prog span.ok{background:var(--mi);color:#fff}
.scene{width:100%;max-width:640px;display:block;margin:6px auto;background:#fff;border-radius:10px;border:1px solid #e3dbe6}
.stepnav{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.stepnav .n{font-weight:700;color:var(--pl)}
.zeig{border:4px solid var(--ink);border-radius:10px;padding:18px;background:#fff;display:grid;grid-template-columns:70px 1fr;gap:16px;align-items:start}
.zeig .big{font-size:24px;font-weight:800;letter-spacing:.05em}
.res{text-align:center}
.stufe{font-size:64px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;margin:10px auto;border:5px solid var(--ink)}
.stufe.A{border-radius:50%}.stufe.B{border-radius:0}.stufe.C{border:none;background:none;position:relative}
.stufe.D{border-radius:50%;border-style:dashed}
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mod{border:2px solid #d9d0dc;border-radius:10px;padding:14px;background:#fff;cursor:pointer;text-align:left;font-size:16px;color:var(--ink)}
.mod b{display:block;font-size:18px;color:var(--pl);margin-bottom:4px}
.mod .badge{font-size:13px;color:var(--gr)}
.mod.done{border-color:var(--mi);background:var(--mil)}
input[type=range]{width:100%;height:44px;accent-color:var(--pl)}
.toggle{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:2px solid #ddd;border-radius:9px;margin:6px 0;cursor:pointer;background:#fff;font-size:16px;width:100%;text-align:left;color:var(--ink)}
.toggle.on.r{border-color:var(--no);background:#fbeaea}.toggle.on.s{border-color:var(--ok);background:#e8f5ee}
.small{font-size:14px;color:var(--gr)}
.ftext span.w{cursor:pointer;border-bottom:2px dotted #bbb;padding:0 1px}
.ftext span.w.hit{background:#e8f5ee;border-bottom-color:var(--ok)}
.ftext span.w.miss{background:#fbeaea}
.word{font-size:36px;letter-spacing:.3em;font-weight:800;color:var(--pl);text-align:center;margin:10px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
footer{max-width:920px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--gr)}
</style>
</head>

<div class="bar"><div id="barIn"></div></div>
<main id="app"></main>

let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
S.q=S.q||{};S.done=S.done||{};S.mods=S.mods||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
const H=(s)=>{app.innerHTML=s;window.scrollTo(0,0)};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function stufe(p){return p>=85?"A":p>=65?"B":p>=40?"C":"D"}
const STXT={A:"Sicher",B:"Gut, kleine Lücken",C:"Teilweise – wiederholen",D:"Noch unsicher – noch einmal üben"};
function rec(id,ok,pts,max){ // erster Versuch zählt
  if(!S.q[id]){S.q[id]={first:pts,max:max||1,now:pts}}else{S.q[id].now=Math.max(S.q[id].now,pts)}
  save();
}
function setBar(p){document.getElementById("barIn").style.width=p+"%"}

/* ---------------- Bausteine ---------------- */
function mc(id,q,opts,ans,exp,tipp){
  return `<div class="q" data-id="${id}"><p><b>${q}</b></p>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}
  ${tipp?`<details><summary>Tipp anzeigen</summary><div class="tipp">${tipp}</div></details>`:""}
  <div class="fb"></div></div>`;
}
function bindMC(root,defs){
  root.querySelectorAll(".q").forEach(qd=>{
    const d=defs[qd.dataset.id];if(!d)return;
    qd.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(qd.dataset.locked)return;
      const i=+b.dataset.i,ok=i===d.a;
      if(!d.pred)rec(qd.dataset.id,ok,ok?1:0,1);
      qd.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));
      b.classList.add(ok?"right":"wrong");
      const fb=qd.querySelector(".fb");
      if(d.pred){fb.className="fb info";fb.innerHTML=d.e;qd.dataset.locked=1;return}
      fb.className="fb "+(ok?"ok":"no");fb.innerHTML=(ok?"Richtig. ":"Noch nicht. ")+(ok?d.e:(d.w||"Versuche es noch einmal. Tipp: Lies die Frage genau."));
      if(ok)qd.dataset.locked=1;
    });
  });
}
/* Zuordnen per Tippen */
function sortHTML(id,items,cats){
  return `<div class="sort" data-id="${id}"><p class="small">Tippe zuerst ein Kärtchen an, dann das passende Feld. Falsch gelegt? Tippe das Kärtchen im Feld an, dann liegt es wieder oben.</p>
  <div class="chips">${items.map((it,i)=>`<button class="chip" data-i="${i}">${it[0]}</button>`).join("")}</div>
  <div class="cats">${cats.map((c,j)=>`<div class="cat" data-j="${j}"><div class="ch">${c}</div><div class="in"></div></div>`).join("")}</div>
  <button class="btn chk" disabled>Prüfen</button><div class="fb"></div></div>`;
}
function bindSort(root,id,items,cats,exp){
  const el=root.querySelector(`.sort[data-id="${id}"]`);let sel=null;const place={};
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{if(c.classList.contains("done"))return;el.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");sel=+c.dataset.i});
  el.querySelectorAll(".cat").forEach(ct=>ct.onclick=()=>{if(sel===null)return;place[sel]=+ct.dataset.j;render();sel=null});
  function render(){el.querySelectorAll(".cat .in").forEach(x=>x.innerHTML="");
    Object.keys(place).forEach(i=>{const d=document.createElement("div");d.className="it";d.dataset.i=i;d.textContent=items[i][0];d.onclick=(ev)=>{if(sel!==null)return;ev.stopPropagation();delete place[i];render()};el.querySelector(`.cat[data-j="${place[i]}"] .in`).appendChild(d)});
    el.querySelectorAll(".chip").forEach(c=>{c.classList.toggle("done",place[c.dataset.i]!==undefined);c.classList.remove("sel")});
    el.querySelector(".chk").disabled=Object.keys(place).length<items.length}
  el.querySelector(".chk").onclick=()=>{let n=0;el.querySelectorAll(".cat .it").forEach(d=>{const ok=items[d.dataset.i][1]===place[d.dataset.i];d.classList.add(ok?"right":"wrong");if(ok)n++});
    rec(id,n===items.length,n,items.length);
    const fb=el.querySelector(".fb");fb.className="fb "+(n===items.length?"ok":"no");
    fb.innerHTML=`${n} von ${items.length} richtig. `+(n===items.length?exp:"Rot markierte Kärtchen antippen, um sie zurückzulegen, und neu zuordnen. "+exp)};
}
function heft(nr,auftrag,muster){
  return `<div class="heft"><b>Ins Heft (Aufgabe ${nr} auf dem Blatt):</b> ${auftrag}<details><summary>Erst schreiben, dann Musterlösung zeigen</summary><div class="tipp">${muster}</div></details></div>`;
}
function zeig(nr,was){
  return `<div class="zeig"><svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="#1f1b22" stroke-width="2.8" stroke-linejoin="round"><path d="M17 26V9a3 3 0 0 1 6 0v13M23 21v-3a3 3 0 0 1 6 0v4M29 21a3 3 0 0 1 6 0v3M35 23a3 3 0 0 1 6 0v8c0 8-5 14-13 14h-2c-5 0-8-3-11-7l-6-8a3 3 0 0 1 4.5-4L17 30"/></svg>
  <div><div class="big">ZEIGEPUNKT ${nr}</div><p><b>Zeige: ${was}</b></p><p>Geh mit dem Blatt und dem iPad zum Zeigeplatz am Lehrerpult. Sind dort schon zwei Personen, bleib sitzen: Leg das Blatt aufgeklappt an den Tischrand und mach weiter. Die Lehrkraft kommt vorbei.</p><p>Noch nicht fertig? Zeige trotzdem, wie weit du gekommen bist.</p></div></div>`;
}

/* ---------------- Entdecker-Bereich ---------------- */
function entdecker(){setBar(0);H(`<div class="card"><div class="kicker">Entdecker-Bereich</div><h1>Für Schnelle und Neugierige</h1><p>Wähle selbst. Jedes Modul hat ein Abzeichen.</p>
 <div class="modgrid">${MODS.map(m=>`<button class="mod ${S.mods[m.id]?"done":""}" onclick="MODS.find(x=>x.id=='${m.id}').run()"><b>${m.name}</b>${m.art} · ca. ${m.min} Min.<div class="badge">${S.mods[m.id]?"Abzeichen erhalten ✓":"noch offen"}</div></button>`).join("")}</div>
 <button class="btn sec" onclick="home()">Übersicht</button></div>`)}
function modDone(id){S.mods[id]=1;save()}
function wende(){const N={
 a:{t:"Jonas steht nach der Schule am Bahnhof. Die Älteren rufen: „Komm mit in den Supermarkt, wir besorgen uns was!“ Jonas ahnt, was sie vorhaben.",o:[["Er sagt: „Heute nicht, ich hab Training.“","c"],["Er ruft seine große Schwester an.","e"],["Er geht zur Schulsozialarbeiterin, die ihm Hilfe angeboten hat.","f"]]},
 c:{t:"Beim Training lobt ihn die Trainerin: „Super Pass!“ Jonas merkt: Hier zählt er auch.",o:[["Weiter","end1"]]},
 e:{t:"Seine Schwester hört zu. Sie verabreden sich für den Abend. Jonas fühlt sich nicht mehr so allein.",o:[["Weiter","end2"]]},
 f:{t:"Die Sozialarbeiterin vermittelt ihm Nachhilfe in Mathe. Seine Noten werden langsam besser.",o:[["Weiter","end3"]]},
 end1:{t:"Ende: Ein Schutzfaktor (Verein, Trainerin) hilft Jonas.",end:true},
 end2:{t:"Ende: Ein Mensch, der zuhört, stärkt Jonas.",end:true},
 end3:{t:"Ende: Hilfe in der Schule baut einen Risikofaktor ab.",end:true}};
 const go=k=>{const n=N[k];H(`<div class="card"><div class="kicker">Entdecker · Wege, die schützen</div><h2>Wege, die schützen</h2><p style="font-size:20px">${n.t}</p>
  ${n.end?`<div class="heft"><b>Ins Heft:</b> Schreibe auf, welcher Schutzfaktor in deinem Weg geholfen hat. Probiere danach die anderen Wege.</div><button class="btn" id="w0">Noch einmal</button><button class="btn mint" id="wx">Zurück zum Entdecker-Bereich</button>`:n.o.map((o,i)=>`<button class="opt" data-k="${o[1]}">${o[0]}</button>`).join("")}</div>`);
  if(n.end){modDone("m1");app.querySelector("#w0").onclick=()=>go("a");app.querySelector("#wx").onclick=entdecker}else app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>go(b.dataset.k))};go("a")}
function fehlertext(){const words=("Das Jugendstrafrecht gilt für Jugendliche von |12| bis 17 Jahren. Sein wichtigstes Ziel ist |Rache|. Die meisten Jugendlichen hören |nie| von selbst auf. Die mildeste Stufe heißt |Jugendstrafe|. Jugendarrest dauert höchstens |vier Monate|.").split("|");
 const fix={1:"14",3:"keine neuen Straftaten",5:"oft / meist",7:"Erziehungsmaßregeln",9:"vier Wochen"};let found=0;
 H(`<div class="card"><div class="kicker">Entdecker · Fehlertext</div><h2>Finde die 5 Fehler</h2><p>Tippe auf jedes falsche Wort.</p><p class="ftext" style="font-size:20px;line-height:1.9">${words.map((w,i)=>i%2?`<span class="w" data-i="${i}">${w}</span>`:w.split(" ").map(x=>x?`<span class="w" data-i="-1">${x}</span>`:"").join(" ")).join(" ")}</p><div class="fb" id="ff"></div><button class="btn mint" onclick="entdecker()">Zurück</button></div>`);
 app.querySelectorAll(".w").forEach(s=>s.onclick=()=>{const i=+s.dataset.i;const fb=app.querySelector("#ff");if(i>0){if(!s.classList.contains("hit")){s.classList.add("hit");found++;s.textContent=s.textContent+" → "+fix[i]}fb.className="fb ok";fb.textContent=`Gefunden: ${found} von 5.`+(found==5?" Alle Fehler gefunden!":"");if(found==5)modDone("m2")}else{s.classList.add("miss");fb.className="fb no";fb.textContent="Das stimmt. Suche weiter."}})}
function spick(){const W=[["Risikofaktor",1],["Schutzfaktor",1],["Erziehungsgedanke",1],["Zuchtmittel",1],["Jugendstrafe als letztes Mittel",1],["Supermarkt",0],["Bahnhof",0],["Kopfhörer",0],["Mathe-Arbeit",0],["Justitia",0]];const sel=new Set();
 H(`<div class="card"><div class="kicker">Entdecker · Spickzettel</div><h2>Mein Spickzettel</h2><p>Wähle die 5 wichtigsten Begriffe für einen Spickzettel zu dieser Reihe.</p><div class="chips">${W.map((w,i)=>`<button class="chip" data-i="${i}">${w[0]}</button>`).join("")}</div><button class="btn" id="sp">Prüfen</button><div class="fb" id="sf"></div>
 <div class="heft"><b>Ins Heft:</b> Spickzettel (Feld 7 × 10 cm), höchstens 30 Wörter und eine Skizze. Dann umdrehen, aus dem Kopf aufschreiben, vergleichen, Fehlendes farbig ergänzen.</div><button class="btn mint" onclick="entdecker()">Zurück</button></div>`);
 app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const i=+c.dataset.i;if(sel.has(i)){sel.delete(i);c.classList.remove("sel")}else if(sel.size<5){sel.add(i);c.classList.add("sel")}});
 app.querySelector("#sp").onclick=()=>{let n=0;sel.forEach(i=>n+=W[i][1]);const fb=app.querySelector("#sf");fb.className="fb "+(n==5?"ok":"info");fb.textContent=n==5?"Sehr gut: Das sind die Fachbegriffe der Reihe.":`${n} von 5 sind Fachbegriffe. Orte und Gegenstände aus den Geschichten sind Beispiele, keine Fachbegriffe.`;if(n==5)modDone("m3")}}
function code(){const Q=[["Wer unter 14 ist, ist …","strafmündig","strafunmündig",1,"E"],["Ein Umstand, der vor Straftaten schützt, heißt …","Schutzfaktor","Risikofaktor",0,"R"],["Die strengste Maßnahme ist die …","Verwarnung","Jugendstrafe",1,"Z"],["Ein soziales Training ist eine …","Weisung","Jugendstrafe",0,"I"],["Jugendarrest dauert höchstens …","4 Wochen","4 Jahre",0,"E"],["Straftaten, die nie bekannt werden, bilden das …","Hellfeld","Dunkelfeld",1,"H"],["Den Schaden ersetzen heißt: das Opfer …","entschädigen","abschrecken",0,"U"],["Das JGG gilt für Jugendliche von 14 bis …","17","25",0,"N"],["Die Jugendstrafe ist das … Mittel.","erste","letzte",1,"G"]];let k=0,w="";
 const step=()=>{if(k==Q.length){modDone("m4");H(`<div class="card"><div class="kicker">Entdecker · Codewort</div><h2>Geschafft!</h2><div class="word">${w}</div><p>Darauf setzt das Jugendstrafrecht vor allem.</p><button class="btn mint" onclick="entdecker()">Zurück</button></div>`);return}
  const q=Q[k];H(`<div class="card"><div class="kicker">Entdecker · Codewort · Frage ${k+1}/${Q.length}</div><div class="word">${w.padEnd(Q.length,"_")}</div><p style="font-size:20px"><b>${q[0]}</b></p><button class="opt" data-i="0">${q[1]}</button><button class="opt" data-i="1">${q[2]}</button><div class="fb" id="cf"></div></div>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(+b.dataset.i===q[3]){w+=q[4];k++;step()}else{b.classList.add("wrong");const f=app.querySelector("#cf");f.className="fb no";f.textContent="Noch nicht – versuche die andere Antwort."}})};step()}
function gestalten(){modDone("m5");H(`<div class="card"><div class="kicker">Entdecker · Selbst gestalten</div><h2>Immer noch fit? Gestalte selbst</h2>
 <p>Wähle eine Aufgabe für dein Heft:</p>
 <div class="heft"><b>A · Fall erfinden:</b> Erfinde einen Fall (Name, Alter, Tat, Vortaten, Einsicht). Schreibe darunter, welche Maßnahme passt und welcher Strafzweck. Gib ihn deinem Nachbarn zum Lösen.</div>
 <div class="heft"><b>B · Erklär-Plakat:</b> Zeichne ein kleines Plakat „Jugendstrafrecht in 3 Stufen“ mit Treppe, je einem Beispiel und einem Merksatz.</div>
 <div class="heft"><b>C · Quiz für die Klasse:</b> Schreibe 5 Quizfragen mit Lösung zu Risikofaktoren und Jugendstrafrecht.</div>
 <button class="btn mint" onclick="entdecker()">Zurück</button></div>`)}

/* ---------------- Start ---------------- */
document.getElementById("homeBtn").onclick=home;
document.getElementById("resetBtn").onclick=()=>{H(`<div class="card"><h2>Wirklich neu starten?</h2><p>Alle Punkte und Abzeichen auf diesem iPad werden gelöscht.</p><button class="btn" id="ry">Ja, neu starten</button><button class="btn sec" onclick="home()">Nein, zurück</button></div>`);document.getElementById("ry").onclick=()=>{S={q:{},done:{},mods:{}};save();home()}};
function route(){const h=location.hash;if(h==="#animation"){cur={t:1,i:3,v:false};show()}else if(h==="#animation-2"){cur={t:2,i:0,v:false};show()}else if(h==="#animation-3"){cur={t:2,i:3,v:false};show()}else if(h==="#animation-4"){cur={t:2,i:5,v:false};show()}else if(h==="#teil1")start(1);else if(h==="#teil2")start(2);else home()}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
