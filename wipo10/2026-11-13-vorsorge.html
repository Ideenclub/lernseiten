<style>
:root{--plum:#4E2447;--plum2:#6d3a63;--sage:#5F7F63;--sagebg:#e9f0e9;--cream:#f7f4ef;--paper:#fff;--ink:#231b22;--muted:#6a6168;
--line:#ddd5d9;--ok:#2f6b3a;--okbg:#e5f2e6;--no:#9b2c1f;--nobg:#f8e4e0}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:19px;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--paper);border-top:6px solid var(--plum);border-bottom:1px solid var(--line);padding:12px 20px 10px}
header .fach{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-weight:700}
header h1{font-size:23px;line-height:1.2;margin:2px 0 0;color:var(--plum);font-weight:800}
.steps{display:flex;gap:4px;margin-top:10px;align-items:center}
.steps span{flex:1;height:6px;background:#e7e0e4}
.steps span.done{background:var(--sage)}.steps span.now{background:var(--plum)}
.steps i{width:10px}
main{max-width:820px;margin:0 auto;padding:18px 18px 60px}
.kicker{color:var(--sage);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 2px}
h2{font-size:28px;line-height:1.2;margin:0 0 12px;color:var(--plum);font-weight:800}
.lead{background:var(--paper);border-top:3px solid var(--plum);padding:14px 16px;margin:0 0 16px}
.lead p{margin:0 0 8px}.lead p:last-child{margin:0}
.src{font-size:13px;color:var(--muted);font-style:italic}
figure{margin:0 0 16px}figure img{display:block;width:100%;height:auto;max-height:280px;object-fit:cover}
.book{display:flex;gap:12px;align-items:flex-start;background:var(--sagebg);padding:12px 14px;margin:0 0 16px;border-left:5px solid var(--sage)}
.book svg{flex:0 0 32px}
.q{background:var(--paper);border:1px solid var(--line);padding:16px;margin:0 0 14px}
.q .nr{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:2px}
.q .text{font-weight:650;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}.opts.row{flex-direction:row;flex-wrap:wrap}.opts.row button{flex:1 1 150px}
button{font:inherit;color:inherit}
.opt{min-height:52px;text-align:left;padding:10px 14px;background:#fff;border:2px solid var(--line);cursor:pointer;font-size:18px}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt[disabled]{cursor:default;opacity:1}
.fb{margin-top:10px;padding:10px 12px;font-size:17px}.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}.fb.no{background:var(--nobg);border-left:4px solid var(--no)}.fb b{display:block}
.tip{margin-top:8px}.tip summary{cursor:pointer;color:var(--sage);font-weight:700;font-size:16px;min-height:36px;display:flex;align-items:center}
.tip p{margin:4px 0;font-size:16px}
.write{background:var(--paper);border:2px dashed var(--plum2);padding:16px;margin:0 0 14px}
.write .lab{font-size:14px;font-weight:800;color:var(--plum);letter-spacing:.06em;text-transform:uppercase}
.write .muster{display:none;background:#faf7fa;border-left:4px solid var(--plum);padding:10px 12px;margin-top:10px;font-size:17px}
.write .muster.show{display:block}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{min-height:54px;padding:12px 22px;font-size:19px;font-weight:700;cursor:pointer;border:2px solid var(--plum)}
.btn.main{background:var(--plum);color:#fff}.btn.sec{background:#fff;color:var(--plum)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.hint{font-size:15px;color:var(--muted);margin-top:8px}
.tri{background:var(--paper);border:1px solid var(--line);padding:14px;margin:0 0 16px}
.tri .forms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tri .forms button{min-height:52px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:700;padding:8px}
.tri .forms button.on{border-color:var(--plum);background:#f5eef4}
.tri .desc{font-size:17px;min-height:52px}
.calc{background:var(--paper);border:1px solid var(--line);padding:14px;margin:0 0 16px}
.calc label{display:block;font-weight:700;margin-top:10px}
.calc input[type=range]{width:100%;height:40px}
.calc .out{font-size:22px;font-weight:800;color:var(--plum);margin-top:8px}
.bars{display:flex;gap:16px;align-items:flex-end;height:170px;margin-top:12px;border-bottom:2px solid var(--ink);padding:0 10px}
.bars div{flex:1;background:var(--sage);position:relative;min-height:2px;transition:height .4s}
.bars div.b2{background:var(--plum)}
.bars div span{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:15px;font-weight:700}
.blab{display:flex;gap:16px;padding:0 10px;font-size:14px;color:var(--muted)}.blab span{flex:1;text-align:center}
.eggs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.eggs .box{border:1px solid var(--line);padding:10px;background:#fff;text-align:center}
.eggs .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:70px;align-items:center}
.eggs .d{width:26px;height:26px;border-radius:50%;background:var(--sage);transition:all .5s}
.eggs .d.big{width:70px;height:70px}
.eggs .d.gone{background:#e3d6d6;outline:2px dashed var(--no)}
.result{background:var(--paper);border:2px solid var(--plum);padding:18px}
.result h3{margin:0 0 4px;font-size:22px;color:var(--plum)}
.meta{font-size:15px;color:var(--muted)}
.stufe{display:flex;align-items:center;gap:18px;margin:16px 0}
.shape{width:86px;height:86px;flex:0 0 86px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;border:4px solid var(--ink);position:relative}
.shape.A{border-radius:50%}.shape.C,.shape.D{border:none}.shape svg{position:absolute;inset:0}.shape b{position:relative}.shape.C b{top:10px}
.stufe .word{font-size:26px;font-weight:800;line-height:1.2}.pts{font-size:20px}
table.et{width:100%;border-collapse:collapse;margin:10px 0;font-size:17px}
table.et td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}table.et td:nth-child(2){white-space:nowrap;font-weight:700;text-align:right}
.note{background:#fff;border:2px dashed var(--sage);padding:12px 14px;margin-top:14px;font-weight:600}
.confirm{display:none;background:var(--nobg);border:2px solid var(--no);padding:12px;margin-top:12px}.confirm.show{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);margin-top:6px}
.part{background:var(--plum);color:#fff;padding:18px;margin:0 0 16px}.part h2{color:#fff}
.part p{margin:0 0 8px}
ul.clean{margin:6px 0 0;padding-left:22px}
footer{font-size:13px;color:var(--muted);text-align:center;padding:20px}
@media (max-width:600px){h2{font-size:24px}body{font-size:18px}.tri .forms{grid-template-columns:1fr}}
</style>
</head>

 {id:'e7', teil:2, kicker:'Teil 2 · Etappe 7 von 7 · ca. 15 Min.', title:'Die Frühstart-Rente', img:null,

   {type:'mc', q:'Welche Ecke des magischen Dreiecks ist bei der Frühstart-Rente am schwächsten?', o:['Sicherheit','Rendite','Verfügbarkeit'], c:2, e:'Das Geld wird grundsätzlich erst ab 65 ausgezahlt – man kommt vorher nicht heran.'}
  ],
  write:{id:'w6', t:['Was spricht dafür (früh, lange Zeit, Zinseszins, gestreut), was dagegen (nur 10 €, Kurse schwanken, erst ab 65)?','„Einerseits …, andererseits …“ · „Insgesamt halte ich … für …, weil …“','Aufbau: 1. Was ist das? 2. dafür 3. dagegen 4. Urteil. Fachbegriffe: Vorsorgelücke, Rendite, Sicherheit, Zinseszins.'], lab:'Aufgabe 6 ins Heft (Kontrollaufgabe)', q:'Beurteile die Frühstart-Rente: Ist sie ein guter Weg gegen Altersarmut? 6–8 Sätze, mit magischem Dreieck und mindestens drei Fachbegriffen. Form: Kommentar für die Schülerzeitung oder Nachricht an eine Tante, deren Kind bald sechs wird.',
   m:'Ab 2027 zahlt der Staat für Kinder ab sechs Jahren jeden Monat 10 € in ein Aktiendepot. Ich finde die Idee gut, denn wer früh anfängt, hat sehr viel Zeit: Durch den Zinseszins kann aus rund 1.440 € bis 65 deutlich mehr werden. Weil das Geld breit gestreut angelegt wird, ist die Rendite-Chance hoch und das Risiko verteilt. Andererseits sind 10 € im Monat wenig; die Vorsorgelücke vieler Menschen wird dadurch nicht geschlossen. Außerdem ist das Geld erst ab 65 verfügbar, und die Kurse können schwanken. Insgesamt halte ich die Frühstart-Rente für einen guten ersten Schritt, aber allein reicht sie nicht. (Auch ein begründetes Nein ist richtig.)'}},

  return '<div class="shape '+L+'" aria-hidden="true"><b>'+L+'</b></div>';
}
function eur(x){ return Math.round(x).toLocaleString('de-DE')+' €'; }
function grow(monthly, months, rate, yearsAfter){
  var m=Math.pow(1+rate/100,1/12)-1, v=0;
  for(var i=0;i<months;i++){ v=(v+monthly)*(1+m); }
  return v*Math.pow(1+rate/100,yearsAfter||0);
}

}

}
function eggsHTML(){
  var g=S.eggs, h='<div class="eggs"><div class="box"><b>Eine Firma</b><div class="dots"><div class="d big'+(g?' gone':'')+'"></div></div><div>'+(g?'Wert jetzt: <b>0 €</b>':'Wert: 1.000 €')+'</div></div>';
  h+='<div class="box"><b>ETF: zehn Firmen</b><div class="dots">';
  for(var i=0;i<10;i++) h+='<div class="d'+(g&&i===3?' gone':'')+'"></div>';
  h+='</div><div>'+(g?'Wert jetzt: <b>900 €</b>':'Wert: 1.000 €')+'</div></div></div>';
  h+='<button class="btn sec" data-eggs="1">'+(g?'Zurücksetzen':'Eine Firma geht pleite')+'</button>';
  return h;
}
function fsrHTML(){
  var r=S.rate, v=grow(10,144,r,47);
  return '<div class="calc"><label for="rate">Angenommene Rendite pro Jahr: <span id="rv">'+r+' %</span></label>'+
   '<input type="range" id="rate" min="0" max="8" step="1" value="'+r+'">'+
   '<div class="bars"><div style="height:'+Math.max(2,1440/40000*150)+'px"><span>1.440 €</span></div><div class="b2" id="b2" style="height:'+Math.min(150,Math.max(2,v/40000*150))+'px"><span id="bv">'+eur(v)+'</span></div></div>'+
   '<div class="blab"><span>eingezahlt vom Staat</span><span>Wert mit 65 (Beispielrechnung)</span></div>'+
   '<p class="hint">Rechnung: 10 € pro Monat vom 6. bis zum 18. Geburtstag, danach bleibt das Geld bis 65 liegen. Inflation ist nicht eingerechnet. Kurse können auch fallen – die Werte sind nicht sicher.</p></div>';
}
function bindQs(mode){
  Array.prototype.forEach.call(app.querySelectorAll('.q'),function(box){
    var id=box.getAttribute('data-id'), q=ALLQ.filter(function(x){return x.id===id;})[0];
    Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(b){
      b.addEventListener('click',function(){
        var i=+b.getAttribute('data-i');
        if(mode==='fix'){ if(S.fixChosen[id]!==undefined) return; S.fixChosen[id]=i; S.fixed[id]=(i===q.c); }
        else { if(S.chosen[id]!==undefined) return; S.chosen[id]=i; if(S.first[id]===undefined) S.first[id]=(i===q.c); }
        save(); var y=window.scrollY; render(); window.scrollTo(0,y);
      });
    });
  });
}
function etDone(et){ return et.qs.every(function(q){return S.chosen[q.id]!==undefined;}) && (!et.write || S.written[et.write.id]) && (!et.write0 || S.written[et.write0.id]); }
function render(){
  bar(); var s=S.screen, h='';
  if(s==='start'){
    h+='<section><div class="kicker">Lernseite · Doppelstunde (90 Minuten)</div><h2>Für später vorsorgen – aber wie?</h2>';
    h+='<figure><img src="'+IMG.coins+'" alt="Alte Hände zählen Münzen"></figure>';
    h+='<div class="lead"><p>Fast jede fünfte Person im Ruhestand gilt in Deutschland als armutsgefährdet. Was kann man selbst tun – und was macht man mit dem ersten eigenen Geld?</p>';
    h+='<p><b>Teil 1</b> (Etappen 1–3): Altersarmut, Risikogruppen, Vier-Töpfe-Prinzip.<br><b>Teil 2</b> (Etappen 4–7): magisches Dreieck, Aktie oder ETF, Entscheidungen, Frühstart-Rente. Danach ein Abschluss-Quiz.</p>';
    h+='<p>Du brauchst dein <b>Buch (S. 201–208)</b> und dein <b>Heft</b>. Wenn ein Kasten „ins Heft“ erscheint, schreibst du zuerst selbst und klappst dann die Musterlösung auf. Es zählt immer dein <b>erster Versuch</b>. Dein Fortschritt bleibt auf diesem iPad gespeichert.</p></div>';
    var started=Object.keys(S.chosen).length>0;
    h+='<div class="nav"><span></span><button class="btn main" id="next">'+(started?'Weitermachen':'Starten')+'</button></div>'+restartHTML()+'</section>';
  }
  if(s==='pause'){
    h+='<section><div class="part"><div class="kicker" style="color:#dfe9df">Pause zwischen Teil 1 und Teil 2</div><h2>Teil 1 geschafft</h2>';
    h+='<p>1. Wenn du ein Arbeitsblatt hast: Vergleiche die Aufgaben 1–3 am Kontrolltisch mit dem Lösungsblatt und verbessere mit anderer Farbe.</p>';
    h+='<p>2. Ohne Blatt: Lies deine Heftantworten zu 1b, 2c und 3b noch einmal und ergänze mit den Musterlösungen.</p>';
    h+='<p>3. Dann geht es mit Teil 2 weiter: Wie lege ich Geld an?</p></div>';
    h+='<div class="nav"><button class="btn sec" id="back">Zurück</button><button class="btn main" id="next">Weiter zu Teil 2</button></div></section>';
  }
  var ei=ETAPPEN.map(function(e){return e.id;}).indexOf(s);
  if(ei>=0){
    var et=ETAPPEN[ei];
    h+='<section><div class="kicker">'+et.kicker+'</div><h2>'+esc(et.title)+'</h2>';
    if(et.img) h+='<figure><img src="'+IMG[et.img]+'" alt="'+esc(et.alt)+'"></figure>';
    h+='<div class="lead">'+et.text.map(function(t){return '<p>'+t+'</p>';}).join('')+'</div>';
    if(et.book) h+='<div class="book">'+BOOK+'<div>'+et.book+'</div></div>';
    if(et.tri) h+=triHTML();
    if(et.eggs) h+=eggsHTML();
    if(et.fsr) h+=fsrHTML();
    et.qs.forEach(function(q,qi){ h+=qHTML(q,qi+1); });
    if(et.write0) h+=writeHTML(et.write0);
    if(et.write) h+=writeHTML(et.write);
    var all=etDone(et);
    h+='<div class="nav"><button class="btn sec" id="back">Zurück</button><button class="btn main" id="next"'+(all?'':' disabled')+'>'+(et.id==='ab'?'Zum Ergebnis':'Weiter')+'</button></div>';
    if(!all) h+='<div class="hint">Beantworte alle Fragen'+(et.write?' und bearbeite den Heft-Auftrag':'')+', dann geht es weiter.</div>';
    h+='</section>';
  }
  if((s==='ergebnis'||s==='fertig')&&!S.doneAt){ S.doneAt=new Date().toISOString(); save(); }
  if(s==='ergebnis'){
    var p=firstPoints(), L=stufe(p), pct=Math.round(p/TOTAL*100), d=new Date(S.doneAt);
    var when=d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+', '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
    h+='<section><div class="kicker">Ergebnis</div><div class="result"><h3>'+esc(TITLE)+'</h3><div class="meta">Abgeschlossen: '+when+'</div>';
    h+='<div class="stufe">'+shape(L)+'<div><div class="word">Stufe '+L+': '+WORT[L]+'</div><div class="pts">1. Versuch: <b>'+p+' von '+TOTAL+' Punkten</b> ('+pct+' %)</div>';
    if(S.fixDone) h+='<div class="pts">nach Verbesserung: <b>'+fixedPoints()+' von '+TOTAL+' Punkten</b></div>';
    h+='</div></div><div class="legend"><span>A: ab 85 %</span><span>B: 65–84 %</span><span>C: 40–64 %</span><span>D: unter 40 %</span><span>Die Stufe richtet sich nach dem 1. Versuch.</span></div><table class="et">';
    ETAPPEN.forEach(function(et,i){
      var n=et.qs.length, k=et.qs.filter(function(q){return S.first[q.id]===true;}).length;
      var name=et.id==='ab'?'Abschluss-Quiz':'Etappe '+(i+1)+' ('+et.title+')';
      var tip=(k/n>=0.75)?'sicher':'wiederhole '+(et.id==='ab'?'das Abschluss-Quiz':'Etappe '+(i+1))+' oder lies '+et.repeat;
      h+='<tr><td>'+esc(name)+'<br><span class="hint" style="margin:0">'+esc(tip)+'</span></td><td>'+k+' von '+n+'</td></tr>';
    });
    h+='</table>';
    if(L==='A') h+='<p><b>Stufe A:</b> Weiter mit „Schon fertig?“ auf S. 3 deines Arbeitsblatts oder unten.</p>';
    var wrong=ALLQ.filter(function(q){return S.first[q.id]===false;});
    h+='<div class="nav">';
    if(wrong.length&&!S.fixDone) h+='<button class="btn main" id="fix">Fehler verbessern ('+wrong.length+')</button>';
    h+='<button class="btn sec" id="fertig">Schon fertig?</button></div>';
    h+='<div class="note">Trag Punkte und Stufe auf deinem Arbeitsblatt bei „Mein Ergebnis“ ein. Dann weiter wie auf dem Blatt beschrieben.</div></div>'+restartHTML()+'</section>';
  }
  if(s==='fix'){
    var wr=ALLQ.filter(function(q){return S.first[q.id]===false;});
    h+='<section><div class="kicker">Fehler verbessern</div><h2>Noch ein Versuch</h2><div class="lead"><p>Hier sind nur die Fragen, die du im ersten Versuch falsch hattest. Deine Stufe bleibt gleich – aber du siehst, was du jetzt kannst.</p></div>';
    wr.forEach(function(q,i){ h+=qHTML(q,i+1,'fix'); });
    var allf=wr.every(function(q){return S.fixChosen[q.id]!==undefined;});
    h+='<div class="nav"><span></span><button class="btn main" id="fixdone"'+(allf?'':' disabled')+'>Zurück zum Ergebnis</button></div></section>';
  }
  if(s==='fertig'){
    var sp=S.sp, v=grow(sp.m,sp.y*12,sp.r,0), ein=sp.m*sp.y*12;
    h+='<section><div class="kicker">Schon fertig?</div><h2>Dein eigener Spar-Rechner</h2>';
    h+='<div class="lead"><p>Probiere aus: Was passiert, wenn du früher anfängst, mehr sparst oder die Rendite anders ausfällt? Notiere im Heft drei Versuche und was dir auffällt.</p></div>';
    h+='<div class="calc"><label for="spm">Sparrate pro Monat: <span id="spmv">'+sp.m+' €</span></label><input type="range" id="spm" min="10" max="200" step="5" value="'+sp.m+'">';
    h+='<label for="spy">Dauer: <span id="spyv">'+sp.y+' Jahre</span></label><input type="range" id="spy" min="5" max="50" step="1" value="'+sp.y+'">';
    h+='<label for="spr">Angenommene Rendite: <span id="sprv">'+sp.r+' %</span></label><input type="range" id="spr" min="0" max="8" step="1" value="'+sp.r+'">';
    h+='<div class="out" id="spout">Eingezahlt: '+eur(ein)+' · Endwert: '+eur(v)+'</div><p class="hint">Beispielrechnung ohne Kosten, Steuern und Inflation. Die Rendite ist nicht garantiert.</p></div>';
    h+='<div class="lead"><p><b>Weitere Aufgaben ins Heft</b> (auch auf S. 3 des Arbeitsblatts):</p><ul class="clean">';
    h+='<li><b>Profi:</b> Rechne die 1.440 € der Frühstart-Rente nach und erkläre mit dem Zinseszins, warum bei 6 % rund 32.000 € werden können – und warum das nicht sicher ist.</li>';
    h+='<li><b>Experte:</b> Gestalte ein Insta-Karussell aus 4 Bildern für Azubis: „Dein erstes Gehalt – so teilst du es auf“.</li>';
    h+='<li><b>Buch S. 207, M11</b> – Aufgabe 7a und 7b.</li>';
    h+='<li><b>Quizfragen:</b> Schreibe Fragen mit Lösung für deine Mitschüler – mindestens 5, gern mehr.</li></ul></div>';
    h+='<div class="nav"><button class="btn sec" id="toerg">Zurück zum Ergebnis</button></div></section>';
  }
  app.innerHTML=h;
  bindQs(s==='fix'?'fix':'normal');
  function on(id,fn){ var el=document.getElementById(id); if(el) el.addEventListener('click',function(){ if(el.disabled) return; fn(); }); }
  on('next',function(){ var i=SCREENS.indexOf(S.screen); go(S.screen==='start'?resumeScreen():SCREENS[i+1]); });
  on('back',function(){ var i=SCREENS.indexOf(S.screen); go(SCREENS[i-1]); });
  on('fix',function(){ go('fix'); });
  on('fixdone',function(){ S.fixDone=true; go('ergebnis'); });
  on('fertig',function(){ go('fertig'); });
  on('toerg',function(){ go('ergebnis'); });
  on('restart',function(){ document.getElementById('confirm').classList.add('show'); });
  on('no',function(){ document.getElementById('confirm').classList.remove('show'); });
  on('yes',function(){ S=fresh(); try{ localStorage.removeItem(KEY); }catch(e){} go('start'); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-w]'),function(b){ b.addEventListener('click',function(){ S.written[b.getAttribute('data-w')]=true; save(); var y=window.scrollY; render(); window.scrollTo(0,y); }); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-tri]'),function(b){ b.addEventListener('click',function(){ S.tri=b.getAttribute('data-tri'); save(); var y=window.scrollY; render(); window.scrollTo(0,y); }); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-eggs]'),function(b){ b.addEventListener('click',function(){ S.eggs=!S.eggs; save(); var y=window.scrollY; render(); window.scrollTo(0,y); }); });
  var rate=document.getElementById('rate');
  if(rate) rate.addEventListener('input',function(){ S.rate=+rate.value; save(); var v=grow(10,144,S.rate,47);
    document.getElementById('rv').textContent=S.rate+' %'; document.getElementById('bv').textContent=eur(v);
    document.getElementById('b2').style.height=Math.min(150,Math.max(2,v/40000*150))+'px'; });
  ['spm','spy','spr'].forEach(function(id){ var el=document.getElementById(id); if(!el) return;
    el.addEventListener('input',function(){ var k={spm:'m',spy:'y',spr:'r'}[id]; S.sp[k]=+el.value; save();
      document.getElementById('spmv').textContent=S.sp.m+' €'; document.getElementById('spyv').textContent=S.sp.y+' Jahre'; document.getElementById('sprv').textContent=S.sp.r+' %';
      var v=grow(S.sp.m,S.sp.y*12,S.sp.r,0); document.getElementById('spout').textContent='Eingezahlt: '+eur(S.sp.m*S.sp.y*12)+' · Endwert: '+eur(v); }); });
}
function resumeScreen(){
  for(var i=0;i<ETAPPEN.length;i++){ if(!etDone(ETAPPEN[i])) return ETAPPEN[i].id; }
  return 'ergebnis';
}
function restartHTML(){
  if(!Object.keys(S.chosen).length) return '';
  return '<div style="margin-top:22px"><button class="btn sec" id="restart">Neu starten</button><div class="confirm" id="confirm"><p style="margin:0 0 10px"><b>Wirklich neu starten?</b> Alle Antworten und dein Ergebnis werden gelöscht.</p><div class="nav" style="margin:0"><button class="btn sec" id="no">Abbrechen</button><button class="btn main" id="yes" style="background:#9b2c1f;border-color:#9b2c1f">Ja, alles löschen</button></div></div></div>';
}
render();
})();
</script>
</body>
</html>
