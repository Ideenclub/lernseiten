<style>
:root{--bg:#f6f3ec;--ink:#1d232b;--c1:#22395a;--c2:#a5412c;--muted:#56606e;--line:#cfd5de;--soft:#e9edf3;--good:#2f6b3a;--goodbg:#e5f0e6;--bad:#a5412c;--badbg:#f6e4df}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--c1)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.htitle{font-weight:700;font-size:19px;line-height:1.2;color:var(--c1)}

.prog i{display:block;height:6px;background:var(--c2);width:0;transition:width .3s}
nav.steps{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 10px}

main{padding:18px 0 60px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px;color:var(--c1)}
h2{font-size:24px;margin:4px 0 10px;color:var(--c1)}
.lead{color:var(--muted);margin:0 0 14px}
.meta{font-size:15px;color:var(--muted)}
.blk{margin:18px 0}
.txt{background:#fff;border-left:5px solid var(--c2);padding:14px 18px}

.src{font-size:14px;color:var(--muted);margin-top:6px}

figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.book{border:2px dashed var(--c1);padding:12px 16px;background:#fff}
.book b{color:var(--c1)}
.q{background:#fff;border:1px solid var(--line);padding:16px 18px}

.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:10px 14px;border:2px solid var(--line);background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt.sel{border-color:var(--c1);background:var(--soft)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.btn{display:inline-block;min-height:48px;padding:10px 20px;border:2px solid var(--c1);background:var(--c1);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--c1)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:10px;padding:10px 14px;display:none}
.fb.show{display:block}
.fb.r{background:var(--goodbg);border-left:5px solid var(--good)}
.fb.w{background:var(--badbg);border-left:5px solid var(--bad)}
.tf{display:flex;gap:8px}.tf .opt{text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{font-size:13px;color:var(--muted)}
.ord .opt .nr{display:inline-block;min-width:28px;font-weight:700;color:var(--c2)}
.heft{background:var(--soft);border:2px solid var(--c1);padding:14px 18px}
.heft .hd{font-weight:700;color:var(--c1)}
details{margin-top:10px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--c1)}
.starters{font-size:16px;color:var(--muted)}

.res{background:#fff;border:2px solid var(--c1);padding:20px}
.stufe{display:flex;align-items:center;gap:16px;margin:12px 0}

.shape.A{border-radius:50%}.shape.B{border-radius:0}.shape.C{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:22px}.shape.D{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.big{font-size:22px;font-weight:700}

.note{background:var(--soft);padding:12px 16px;margin-top:14px;font-weight:600}
.slider{width:100%;height:44px}
.sl-l{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.warn{display:none;background:#fff;border:2px solid var(--bad);padding:12px 16px;margin-top:10px}
.cont{display:block;text-align:center;margin-top:22px;padding:18px;background:var(--c2);color:#fff;font-weight:800;font-size:21px;text-decoration:none;border:0}
.small{font-size:15px;color:var(--muted)}

@media (min-width:1400px){body{font-size:22px}.wrap{max-width:1150px}h1{font-size:38px}h2{font-size:30px}}

nden viele Stunden an Maschinen, in Lärm, Staub und schlechter Luft. Fabrikbesitzer stellten sie gern ein, weil sie viel weniger Lohn bekamen als Erwachsene.</p><p>Für viele Arbeiterfamilien war der Lohn der Kinder trotzdem nötig. Das Geld der Eltern reichte oft nicht für Miete und Essen. Wer in der Fabrik arbeitete, konnte kaum zur Schule gehen und lernte wenig.</p><p>Erst langsam reagierte der Staat. Das Militär klagte, dass viele junge Männer aus Fabrikgegenden zu krank und schwach für den Dienst waren. 1839 verbot Preußen als erster deutscher Staat die Fabrikarbeit von Kindern unter neun Jahren. Kontrolliert wurde das aber lange kaum.</p>", "src": "Autorentext"}, {"t": "book", "html": "<b>Buch S. 257, M7 „Kinderarbeit“:</b> Lies den Bericht des Schulbeamten Karl Friedrich August Grashof. Er war Direktor des öffentlichen Unterrichts am Niederrhein. Der Bericht stammt aus der ersten Hälfte des 19. Jahrhunderts. Beantworte dann die Fragen."}, {"t": "mc", "q": "Wie lange arbeiteten die Kinder laut M7?", "opts": ["sechs Tage in der Woche, jeden Tag von früh morgens bis spät abends", "fünf Tage in der Woche, jeweils vier Stunden", "nur in den Ferien"], "a": 0, "ex": "M7, Zeile 3–5: sechs Tage lang in jeder Woche, von früh morgens bis spät abends."}, {"t": "mc", "q": "Grashof schreibt, dass Fabrikkinder keine Schule besuchen, „liegt in der Natur der Sache“. Was meint er damit?", "opts": ["Unter diesen Bedingungen geht es gar nicht anders – die Kinder haben keine Zeit für die Schule.", "Die Kinder lernen in der Natur mehr als in der Schule.", "Die Schule ist nur im Sommer geöffnet."], "a": 0, "ex": "Wer jeden Tag bis spät abends arbeitet, kann nicht zur Schule gehen. Am Ende fordert Grashof aber: So kann es nicht bleiben."}, {"t": "mc", "q": "Was hält Grashof selbst von diesem Zustand? Lies den letzten Satz von M7.", "opts": ["Er findet ihn falsch und fordert, dass sich etwas ändert.", "Er findet ihn gut, weil die Fabriken Arbeiter brauchen.", "Er hat keine Meinung dazu."], "a": 0, "ex": "Er fragt, wer sich um die Kinder kümmern soll, und schreibt, dass es so nicht bleiben kann."}, {"t": "tf", "q": "1839 verbot Preußen die Fabrikarbeit von Kindern unter neun Jahren. Damit war die Kinderarbeit in Preußen vorbei.", "a": false, "ex": "Das Verbot galt nur für Kinder unter neun Jahren in Fabriken und wurde lange kaum kontrolliert. Ältere Kinder arbeiteten weiter."}, {"t": "heft", "q": "<b>Aufgabe 2b:</b> Grashof war für die Schulen einer ganzen Region zuständig. Erkläre, warum Fabrikkinder laut M7 nicht zur Schule gingen und was Grashof davon hält. Achte auf den letzten Satz.", "starters": "Die Kinder arbeiten … · Er vergleicht sie mit … · Am Ende fragt er … und schreibt …", "model": "Die Kinder arbeiten jeden Tag bis spät abends. Sie sind wie die Zähne eines Rades in die Maschinen eingefügt und haben deshalb keine Zeit für die Schule. Grashof findet das aber nicht richtig: Er fragt, wer sich um die Kinder kümmern soll, und schreibt, dass es so nicht bleiben kann."}]}, {"title": "Zehn Menschen, zwei Zimmer", "short": "3", "min": 9, "book": "Buch S. 257, M8", "blocks": [{"t": "text", "html": "<p>Die Industriestädte wuchsen sehr schnell. Für die vielen Menschen, die vom Land in die Städte zogen, gab es zu wenige Wohnungen. In Berlin und im Ruhrgebiet entstanden große Mietshäuser mit engen Hinterhöfen. Viele Arbeiterfamilien lebten in nur ein oder zwei Zimmern. Wasser holte man oft aus einer Leitung im Flur oder auf dem Hof, die Toilette teilten sich mehrere Familien.</p><p>Weil die Miete teuer und der Lohn niedrig war, nahmen viele Familien zusätzlich <b>Kostgänger</b> auf: fremde Menschen, die gegen Bezahlung einen Schlafplatz mieteten und manchmal auch mitaßen. In den engen, feuchten und schlecht gelüfteten Räumen breiteten sich Krankheiten wie die Tuberkulose schnell aus.</p>", "src": "Autorentext"}, {"t": "book", "html": "<b>Buch S. 257, M8 „Lebensbedingungen“:</b> Lies den Bericht von 1908 und sieh dir das Foto der Einzimmerwohnung an."}, {"t": "mc", "q": "Fall: Vater, Mutter, sechs Kinder und zwei Kostgänger leben in einer Wohnung mit zwei Betten. Wie viele Menschen teilen sich nachts ein Bett, wenn alle in den Betten schlafen?", "opts": ["2", "4", "5", "10"], "a": 2, "ex": "2 + 6 + 2 = 10 Personen. 10 : 2 Betten = 5 Personen pro Bett."}, {"t": "mc", "q": "Warum nahm die Familie trotz der Enge noch Kostgänger auf?", "opts": ["Die Kostgänger zahlten für den Schlafplatz – die Familie brauchte das Geld für die Miete.", "Es war gesetzlich vorgeschrieben.", "Die Kostgänger passten auf die Kinder auf, während die Eltern arbeiteten."], "a": 0, "ex": "Der Lohn reichte nicht. Das Geld der Kostgänger half, die Miete zu bezahlen."}, {"t": "multi", "q": "Welche Folgen hatten die engen Wohnungen? (M8 und Text)", "opts": ["Krankheiten breiteten sich schnell aus.", "Die Menschen konnten sich kaum erholen.", "Die Kinder hatten viel Platz zum Spielen.", "Es war oft schmutzig und die Luft schlecht."], "a": [0, 1, 3], "ex": "Enge, Schmutz und schlechte Luft machten krank und ließen kaum Erholung zu."}]}, {"title": "Ein Kreis, aus dem man schwer herauskommt", "short": "4", "min": 8, "book": "Arbeitsblatt Aufgabe 4", "blocks": [{"t": "order", "q": "Bringe die Schritte des Teufelskreises in die richtige Reihenfolge. Tippe sie nacheinander an.", "items": ["Die Eltern verdienen nur wenig Lohn.", "Die Kinder müssen mitarbeiten, damit die Familie genug Geld hat.", "Die Kinder haben keine Zeit für die Schule und lernen wenig.", "Als Erwachsene finden sie nur ungelernte, schlecht bezahlte Arbeit.", "Sie bekommen selbst Kinder – die Familie ist wieder arm, alles beginnt von vorn."], "ex": "Lohn zu niedrig → Kinderarbeit → keine Bildung → schlecht bezahlte Arbeit → die nächste Generation ist wieder arm."}, {"t": "multi", "q": "Welche Maßnahmen könnten den Teufelskreis durchbrechen?", "opts": ["Kinderarbeit verbieten und die Schulpflicht durchsetzen", "höhere Löhne für die Eltern", "noch mehr Kostgänger aufnehmen", "die Kinder noch länger arbeiten lassen"], "a": [0, 1], "ex": "Wenn Kinder zur Schule gehen und Eltern genug verdienen, haben die Kinder später bessere Chancen."}, {"t": "heft", "q": "<b>Aufgabe 4b:</b> Erkläre, warum man von einem „Teufelskreis“ spricht. Nenne eine Möglichkeit, ihn zu durchbrechen, und begründe sie.", "starters": "Man spricht von einem Teufelskreis, weil … · Durchbrechen könnte man ihn, indem … · Dann …", "model": "Man spricht von einem Teufelskreis, weil jede Folge wieder zur Ursache wird: Die Armut wird von den Eltern an die Kinder weitergegeben. Durchbrechen könnte man ihn, indem man Kinderarbeit verbietet und die Schulpflicht durchsetzt. Dann lernen die Kinder etwas, finden später bessere Arbeit und verdienen mehr."}]}, {"title": "Wer ist schuld?", "short": "5", "min": 8, "book": "Arbeitsblatt Aufgabe 5", "blocks": [{"t": "html", "html": "<div class='txt'><p>Jonas (13) meint: <i>„Die Eltern waren selbst schuld. Sie hätten ihre Kinder einfach in die Schule schicken müssen.“</i></p></div>"}, {"t": "mc", "q": "Welches Argument spricht am stärksten GEGEN die Meinung von Jonas?", "opts": ["Ohne den Lohn der Kinder hätte die Familie die Miete und das Essen nicht bezahlen können.", "Die Schule war damals sehr langweilig.", "Die Kinder wollten lieber arbeiten als lernen."], "a": 0, "ex": "Die Eltern hatten wegen des niedrigen Lohns kaum eine Wahl – das ist der Kern des Teufelskreises."}, {"t": "mc", "q": "Wer trug nach dem, was du gelernt hast, die größte Verantwortung dafür, dass Kinder arbeiten mussten?", "opts": ["vor allem die niedrigen Löhne und Fabrikbesitzer, die Kinder als billige Arbeitskräfte nutzten, sowie fehlende Gesetze", "nur die Kinder selbst", "niemand – Kinderarbeit hatte keine Ursachen"], "a": 0, "ex": "Fabrikbesitzer profitierten von billiger Kinderarbeit, Löhne waren zu niedrig, und der Staat schützte die Kinder lange kaum."}, {"t": "heft", "q": "<b>Aufgabe 5 (Kontrolle):</b> Nimm Stellung zur Meinung von Jonas (4–5 Sätze). Nutze, was du  document.getElementById('rsy').onclick=()=>{S={st:0,ans:{},done:false,fin:null,retry:null,heft:{},sl:{}};save();render();};
 const bo=document.getElementById('bon');if(bo)bo.onclick=()=>{S.st=CFG.bonusIndex;save();render();};
}
function renderRetry(list){
 app.innerHTML='<h1>Fehler verbessern</h1><p class="lead">Hier stehen nur die Fragen, die im 1. Versuch falsch waren. Dein Ergebnis im 1. Versuch bleibt gespeichert.</p>';
 list.forEach(b=>{const d=document.createElement('div');d.className='blk';app.appendChild(question(b,d));});
 const nb=document.createElement('div');nb.className='navbtns';const x=document.createElement('button');x.className='btn';x.textContent='Zurück zum Ergebnis';x.onclick=()=>{S.st=E.length;save();render();};nb.appendChild(x);app.appendChild(nb);
}
document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(ev.key==='ArrowRight'&&S.st<E.length){S.st++;save();render();}if(ev.key==='ArrowLeft'&&S.st>0){S.st--;save();render();}});
render();
</script>
