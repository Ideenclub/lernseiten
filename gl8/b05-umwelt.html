<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Preis für die Natur</title>
<!-- Bild: Auguste Brouet, At the Creusot Works: The Smokestacks, um 1902–41, Radierung, Cleveland Museum of Art, CC0, über Unsplash (Cm3VK1HcYQY) -->
<style>
:root{--bg:#f4f2e8;--ink:#22251f;--c1:#47562a;--c2:#9a7310;--muted:#5b5e60;--line:#d3d4c6;--soft:#eceee0;--good:#2f6b3a;--goodbg:#e5f0e6;--bad:#a0442a;--badbg:#f6e4df}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--c1)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.htitle{font-weight:700;font-size:19px;line-height:1.2;color:var(--c1)}
.prog{height:6px;background:var(--line);margin-bottom:-2px}
.prog i{display:block;height:6px;background:var(--c2);width:0;transition:width .3s}
nav.steps{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 10px}
nav.steps button{min-width:44px;min-height:44px;border:2px solid var(--c1);background:#fff;color:var(--c1);font-weight:700;font-size:16px;cursor:pointer}
nav.steps button.on{background:var(--c1);color:#fff}
nav.steps button.ok{border-color:var(--good)}
main{padding:18px 0 60px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px;color:var(--c1)}
h2{font-size:24px;margin:4px 0 10px;color:var(--c1)}
.lead{color:var(--muted);margin:0 0 14px}
.meta{font-size:15px;color:var(--muted)}
.blk{margin:18px 0}
.txt{background:#fff;border-left:5px solid var(--c2);padding:14px 18px}
.txt p{margin:0 0 10px}.txt p:last-child{margin:0}
.src{font-size:14px;color:var(--muted);margin-top:6px}
figure{margin:0}figure img{width:100%;height:auto;display:block;border:1px solid var(--line)}
figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.book{border:2px dashed var(--c1);padding:12px 16px;background:#fff}
.book b{color:var(--c1)}
.q{background:#fff;border:1px solid var(--line);padding:16px 18px}
.q .qq{font-weight:600;margin-bottom:10px}
.q .tag{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:10px 14px;border:2px solid var(--line);background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt.sel{border-color:var(--c1);background:var(--soft)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.btn{display:inline-block;min-height:48px;padding:10px 20px;border:2px solid var(--c1);background:var(--c1);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--c1)}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:10px;padding:10px 14px;display:none}
.fb.show{display:block}
.fb.r{background:var(--goodbg);border-left:5px solid var(--good)}
.fb.w{background:var(--badbg);border-left:5px solid var(--bad)}
.tf{display:flex;gap:8px}.tf .opt{text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{font-size:13px;color:var(--muted)}
.ord .opt .nr{display:inline-block;min-width:28px;font-weight:700;color:var(--c2)}
.heft{background:var(--soft);border:2px solid var(--c1);padding:14px 18px}
.heft .hd{font-weight:700;color:var(--c1)}
details{margin-top:10px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--c1)}
.starters{font-size:16px;color:var(--muted)}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.res{background:#fff;border:2px solid var(--c1);padding:20px}
.stufe{display:flex;align-items:center;gap:16px;margin:12px 0}
.shape{width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff;background:var(--c1)}
.shape.A{border-radius:50%}.shape.B{border-radius:0}.shape.C{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:22px}.shape.D{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.big{font-size:22px;font-weight:700}
table.et{width:100%;border-collapse:collapse;font-size:16px;margin-top:10px}
table.et td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
.note{background:var(--soft);padding:12px 16px;margin-top:14px;font-weight:600}
.slider{width:100%;height:44px}
.sl-l{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.warn{display:none;background:#fff;border:2px solid var(--bad);padding:12px 16px;margin-top:10px}
.cont{display:block;text-align:center;margin-top:22px;padding:18px;background:var(--c2);color:#fff;font-weight:800;font-size:21px;text-decoration:none;border:0}
.small{font-size:15px;color:var(--muted)}
table.et td:nth-child(2){white-space:nowrap}
@media (min-width:1400px){body{font-size:22px}.wrap{max-width:1150px}h1{font-size:38px}h2{font-size:30px}}
@media (max-width:620px){.cols{grid-template-columns:1fr}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

S. 258, M9)."}, {"t": "mc", "q": "Warum sah ein Fabrikbesitzer den Rauch wohl gern?", "opts": ["Rauch bedeutete: Die Maschinen laufen, es wird produziert und Geld verdient.", "Rauch hielt Diebe fern.", "Er mochte den Geruch."], "a": 0, "ex": "Wo Rauch aufstieg, liefen die Maschinen – das brachte Gewinn."}]}, {"title": "Ursache und Folge", "short": "2", "min": 10, "book": "Buch S. 258, M9", "blocks": [{"t": "text", "html": "<p>Dass die Industrie der Natur und der Gesundheit schadet, erkannten die Menschen nur sehr langsam. Viele Fabriken leiteten ihr giftiges Abwasser ohne Reinigung in Flüsse und ins Grundwasser. Fische starben, und Menschen, die das Wasser nutzten, wurden krank.</p><p>Aus den Schornsteinen stiegen Rauch, Ruß und Abgase. In den Industriestädten stank es, die Luft war schmutzig, und viele Menschen litten unter Atembeschwerden.</p><p>Für Kohle und Erz wurden große Flächen umgegraben, und die Städte wuchsen ins Umland. Wälder, Wiesen und Bäche verschwanden. Viele Tiere verloren ihren Lebensraum, und die Zahl der Tier- und Pflanzenarten ging zurück.</p>", "src": "Autorentext"}, {"t": "book", "html": "<b>Buch S. 258, M9 „Die Folgen für die Umwelt“:</b> Lies den Text im Buch zusätzlich. Dort findest du weitere Folgen, zum Beispiel Überschwemmungen."}, {"t": "match", "q": "Was führte zu welcher Folge? Ordne zu.", "left": ["giftiges Abwasser in Flüssen", "Rauch und Abgase aus Schornsteinen", "Abbau von Kohle und Erz, wachsende Städte"], "right": ["Fischsterben, krankes Wasser", "Gestank, Atembeschwerden", "Tiere verlieren ihren Lebensraum"], "ex": "Abwasser → Fischsterben · Rauch → Atembeschwerden · Abbau und Städtewachstum → Lebensraum zerstört."}, {"t": "tf", "q": "Die Menschen erkannten die Umweltfolgen der Industrie sofort und schützten die Natur.", "a": false, "ex": "Das Bewusstsein für die Folgen entstand nur sehr langsam."}, {"t": "mc", "q": "Welche Folge ist am schwersten wiedergutzumachen?", "opts": ["Tier- und Pflanzenarten sterben aus.", "Ein Raum riecht nach Rauch.", "Eine Straße ist staubig."], "a": 0, "ex": "Ausgestorbene Arten kommen nie wieder zurück."}]}, {"title": "Warum tat kaum jemand etwas?", "short": "3", "min": 8, "book": "Buch S. 258, M9 ab Zeile 25", "blocks": [{"t": "book", "html": "<b>Buch S. 258, M9 ab Zeile 25:</b> Lies, warum Unternehmer, Städte und Arbeiter lange nichts gegen die Verschmutzung taten."}, {"t": "match", "q": "Ordne jeder Gruppe ihren Grund zu.", "left": ["Unternehmer", "Stadtverwaltung", "Arbeiterfamilien"], "right": ["Umweltschutz hätte Geld gekostet und den Gewinn verringert.", "Angst, dass die Fabriken bei Auflagen in andere Regionen abwandern", "Sie waren auf die Arbeit angewiesen, ihre Not war zu groß."], "ex": "Kosten (Unternehmer) · Angst vor Abwanderung (Stadt) · Not und Abhängigkeit (Arbeiter)."}, {"t": "mc", "q": "Was hätte die Stadt verloren, wenn eine Fabrik abgewandert wäre?", "opts": ["Arbeitsplätze für die Menschen und Einnahmen", "nur ein altes Gebäude", "nichts"], "a": 0, "ex": "Mit der Fabrik wären Arbeitsplätze und Geld für die Stadt verschwunden."}, {"t": "heft", "q": "<b>Aufgabe 3b:</b> Wer von den drei Gruppen hätte am ehesten etwas ändern können? Begründe deine Wahl (2–3 Sätze).", "starters": "Am ehesten hätte … etwas ändern können, weil … · Die Arbeiter dagegen …", "model": "Am ehesten hätte die Stadtverwaltung bzw. der Staat etwas ändern können, weil sie Regeln für alle Fabriken gleichzeitig erlassen können. Dann hätte keine Fabrik einen Vorteil gehabt. Auch richtig: die Unternehmer, weil sie das Geld für Filter und Kläranlagen hatten."}]}, {"title": "Eine Karikatur entschlüsseln", "short": "4", "min": 10, "book": "Buch S. 258, M9 (Skizze)", "blocks": [{"t": "book", "html": "<b>Buch S. 258, M9:</b> Sieh dir die Skizze „Pfui Deibel!“ von Heinrich Kley (1905) genau an. „Pfui Deibel!“ ist ein alter Ausruf, wenn man sich vor etwas ekelt (Deibel = Teufel)."}, {"t": "html", "html": "<div class='txt'><p><b>So entschlüsselst du eine Karikatur:</b> 1. Beschreiben – Was sehe ich? 2. Deuten – Was will der Zeichner sagen? 3. Beurteilen – Hat er recht? Eine Karikatur <b>übertreibt</b> absichtlich, um auf ein Problem aufmerksam zu machen.</p></div>"}, {"t": "mc", "q": "Woran erkennst du, wer die riesige Gestalt ist?", "opts": ["am Titel „Pfui Deibel!“ (Deibel = Teufel)", "an ihrer Uniform", "an einem Namensschild"], "a": 0, "ex": "Der Titel verrät es: Die Gestalt ist der Teufel."}, {"t": "mc", "q": "Wo steckt der Kopf der riesigen Gestalt?", "opts": ["mitten im dichten Rauch eines Schornsteins", "in einem Fenster der Fabrik", "in einem Fluss"], "a": 0, "ex": "Die Gestalt beugt sich vor, ihr Kopf steckt im Rauch – sie bekommt den Gestank direkt ab."}, {"t": "mc", "q": "Der Teufel lebt der Sage nach in der Hölle – mit Feuer, Rauch und Schwefelgestank. Was will Kley also sagen, wenn sogar der Teufel „Pfui!“ ruft?", "opts": ["Die Luft in den Industriegebieten ist so schlimm, dass sich sogar der Teufel ekelt – schlimmer als die Hölle.", "Der Teufel arbeitet in der Fabrik.", "Fabriken sind besonders sauber."], "a": 0, "ex": "Kley kritisiert die starke Luftverschmutzung: Selbst der Teufel findet sie ekelhaft."}, {"t": "tf", "q": "Eine Karikatur zeigt die Wirklichkeit immer genau so, wie sie ist.", "a": false, "ex": "Eine Karikatur übertreibt absichtlich, um ein Problem deutlich zu machen."}, {"t": "heft", "q": "<b>Aufgabe 4 ins Heft (oder aufs Blatt):</b> Beschreibe die Karikatur und deute sie. Bonus: Beurteile, ob Kley übertreibt und ob die Skizze heute noch passt.", "starters": "Im Bild sieht man … · Der Zeichner will zeigen, dass … · Ich finde, Kley …, weil … · Heute …", "model": "Zwischen rauchenden Fabrikschornsteinen steht eine riesige, muskulöse Gestalt. Sie beugt sich vor, ihr Kopf steckt im Rauch. Der Titel zeigt: Es ist der Teufel. Wenn sogar er sich ekelt, ist die Luft schlimmer als die Hölle. Kley kritisiert die Luftverschmutzung durch die Fabriken. Er übertreibt, aber das Problem war echt: Gestank und Krankheiten. Heute passt die Karikatur noch für Städte mit starkem Smog."}]}, {"title": "Hat sich der Preis gelohnt?", "short": "5", "min": 9, "book": "Buch S. 256–258", "blocks": [{"t": "html", "html": "<div class='txt'><p>Denk an alles, was du über den Preis des Fortschritts weißt: lange Arbeitstage in der Fabrik, Kinderarbeit, enge Wohnungen – und die Folgen für die Umwelt. Auf der anderen Seite stehen Eisenbahnen, billigere Waren, neue Arbeitsplätze und später mehr Wohlstand.</p></div>"}, {"t": "slider", "k": "pos", "q": "Hat sich der Preis des Fortschritts gelohnt? Stelle den Regler auf deine Meinung.", "l": "nein, auf keinen Fall", "m": "teils, teils", "r": "ja, auf jeden Fall", "texts": ["Du findest: eher nicht gelohnt. Nenne in deiner Stellungnahme trotzdem ein Argument für den Fortschritt.", "Du bist unentschieden. Wäge in deiner Stellungnahme beide Seiten ab und entscheide dich am Ende.", "Du findest: eher gelohnt. Nenne in deiner Stellungnahme trotzdem ein Argument zum hohen Preis."]}, {"t": "mc", "q": "Welche Stellungnahme ist vollständig?", "opts": ["„Einerseits brachte die Industrialisierung Eisenbahnen und billigere Waren. Andererseits mussten Kinder arbeiten und Flüsse wurden vergiftet. Ich finde, es hat sich nur teilweise gelohnt, weil man die Menschen und die Natur hätte schützen können.“", "„Die Industrialisierung war schlecht.“", "„Es gab Fabriken, Eisenbahnen und Dampfmaschinen.“"], "a": 0, "ex": "Eine vollständige Stellungnahme hat ein Argument dafür, eines dagegen und ein begründetes Urteil."}, {"t": "heft", "q": "<b>Aufgabe 5 (Kontrolle):</b> Nimm im Heft Stellung (5–6 Sätze): ein Argument für den Fortschritt, ein Argument zum Preis, dein Urteil mit Begründung.", "starters": "Einerseits … · Andererseits … · Ich finde, dass …, weil … · Am schwersten wiegt für mich …", "model": "Einerseits brachte die Industrialisierung Fortschritt: Eisenbahnen, billigere Waren und neue Arbeitsplätze. Später ging es vielen Menschen dadurch besser. Andererseits zahlten die Arbeiter und die Natur einen hohen Preis: 12 bis 14 Stunden Arbeit, Kinderarbeit, enge Wohnungen, Krankheiten und vergiftete Flüsse. Ich finde, dass sich der Fortschritt nur teilweise gelohnt hat, weil man den Preis mit Arbeiterschutz und Kläranlagen hätte senken können."}]}, {"title": "Abschluss-Check", "short": "6", "min": 7, "book": "Buch S. 258", "blocks": [{"t": "tf", "q": "Viele Fabriken leiteten ihr Abwasser ungeklärt in Flüsse.", "a": true, "ex": "Ja, ohne Reinigung – mit Fischsterben und Krankheiten als Folge."}, {"t": "mc", "q": "Heute droht ein Unternehmen: „Wenn hier strengere Umweltregeln kommen, verlegen wir unsere Fabrik ins Ausland.“ An welche Gruppe von 1900 erinnert dich die Sorge der Stadt?", "opts": ["an die Stadtverwaltungen, die Angst vor der Abwanderung der Fabriken hatten", "an die Kirchen", "an die Kinder in den Spinnereien"], "a": 0, "ex": "Schon um 1900 fürchteten Städte, dass Fabriken bei Umweltauflagen abwandern."}, {"t": "tf", "q": "Für die Arbeiterfamilien war Umweltschutz um 1900 das wichtigste Ziel.", "a": false, "ex": "Ihre soziale Not war so groß, dass für Umweltfragen kaum Raum blieb."}, {"t": "mc", "q": "Was macht eine Karikatur?", "opts": ["Sie übertreibt absichtlich, um auf ein Problem aufmerksam zu machen.", "Sie zeigt ein Foto ohne Veränderung.", "Sie ist immer eine Werbung."], "a": 0, "ex": "Übertreibung ist das wichtigste Mittel einer Karikatur."}, {"t": "multi", "q": "Welche Folgen der Industrialisierung für die Umwelt nennt M9?", "opts": ["Fischsterben", "Luftverschmutzung und Gestank", "Rückgang der Artenvielfalt", "Plastikmüll im Meer"], "a": [0, 1, 2], "ex": "Plastikmüll im Meer ist ein Problem unserer Zeit – M9 nennt ihn nicht."}]}, {"title": "Schon fertig? Damals und heute", "short": "★", "min": 10, "bonus": true, "blocks": [{"t": "match", "q": "Damals oder heute? Ordne jede Maßnahme bzw. jedes Problem richtig zu.", "left": ["Kläranlagen reinigen das Abwasser.", "Abwasser fließt ungeklärt in den Fluss.", "Abgase heizen das Klima auf (Klimawandel)."], "right": ["heute: Maßnahme gegen Wasserverschmutzung", "damals: üblich um 1900", "heute: ein großes Umweltproblem"], "ex": "Kläranlagen und Filter sind heute Pflicht. Der Klimawandel ist ein Problem unserer Zeit."}, {"t": "heft", "q": "<b>Bonus ins Heft:</b> Zeichne eine eigene Karikatur zu einem Umweltproblem von heute (Strichmännchen erlaubt). Gib ihr einen Titel und schreibe zwei Sätze zu ihrer Aussage. Danach: Spickzettel „Der Preis des Fortschritts“ (7 × 10 cm, höchstens 30 Wörter) – zudecken, aus dem Kopf aufschreiben, vergleichen.", "model": "Idee: Ein Fisch mit Taucherbrille in einem Meer voller Plastikflaschen, Titel „Urlaub im Meer“. Aussage: Plastikmüll zerstört den Lebensraum der Tiere."}]}], "bonusIndex": 6, "next": null, "prev": null};
const KEY=CFG.key;
let S={st:0,ans:{},done:false,fin:null,retry:null,heft:{},sl:{}};
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(S,JSON.parse(r));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const app=document.getElementById('app');
const E=CFG.etappen;
// Fragen-IDs
let QIDS=[];E.forEach((e,ei)=>e.blocks.forEach((b,bi)=>{if(isQ(b)){b.id='q'+ei+'_'+bi;b.et=ei;if(!e.bonus)QIDS.push(b);}}));
function isQ(b){return ['mc','multi','tf','order','match'].includes(b.t);}
function esc(s){return String(s);}
function shuffle(a,seed){a=a.slice();let x=seed||7;for(let i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stepsNav(){
 const n=document.getElementById('steps');n.innerHTML='';
 E.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e.short||(i+1);b.title=e.title;b.setAttribute('aria-label','Etappe '+(i+1)+': '+e.title);
  if(i===S.st)b.className='on';else if(etDone(i))b.className='ok';b.onclick=()=>{S.st=i;save();render();};n.appendChild(b);});
 const r=document.createElement('button');r.textContent='Ergebnis';r.style.padding='0 12px';if(S.st===E.length)r.className='on';r.onclick=()=>{S.st=E.length;save();render();};n.appendChild(r);
 const done=QIDS.filter(q=>S.ans[q.id]).length;document.getElementById('bar').style.width=(QIDS.length?100*done/QIDS.length:0)+'%';
}
function etDone(i){const qs=QIDS.filter(q=>q.et===i);return qs.length>0&&qs.every(q=>S.ans[q.id]);}
function render(){
 stepsNav();app.innerHTML='';window.scrollTo(0,0);
 if(S.st>=E.length){return renderResult();}
 const e=E[S.st];
 const h=document.createElement('div');
 h.innerHTML=(S.st===0?'<h1>'+CFG.title+'</h1><p class="lead">'+CFG.lead+'</p>':'')+'<div class="meta">Etappe '+(S.st+1)+' von '+E.length+' · ca. '+e.min+' Min.'+(e.bonus?' · Bonus, zählt nicht':'')+'</div><h2>'+e.title+'</h2>';
 app.appendChild(h);
 e.blocks.forEach(b=>app.appendChild(block(b)));
 const nb=document.createElement('div');nb.className='navbtns';
 if(S.st>0){const p=document.createElement('button');p.className='btn sec';p.textContent='← Zurück';p.onclick=()=>{S.st--;save();render();};nb.appendChild(p);}else nb.appendChild(document.createElement('span'));
 const nx=document.createElement('button');nx.className='btn';nx.textContent=S.st===E.length-1?'Zum Ergebnis →':'Weiter →';nx.onclick=()=>{S.st++;save();render();};nb.appendChild(nx);
 app.appendChild(nb);
}
function block(b){
 const d=document.createElement('div');d.className='blk';
 if(b.t==='text'){d.innerHTML='<div class="txt">'+b.html+'</div>'+(b.src?'<div class="src">'+b.src+'</div>':'');return d;}
 if(b.t==='img'){d.innerHTML='<figure><img src="'+CFG.img[b.src]+'" alt="'+(b.alt||'')+'"><figcaption>'+b.cap+'</figcaption></figure>';return d;}
 if(b.t==='book'){d.innerHTML='<div class="book">'+b.html+'</div>';return d;}
 if(b.t==='html'){d.innerHTML=b.html;return d;}
 if(b.t==='heft'){d.innerHTML='<div class="heft"><div class="hd">Ins Heft</div><div>'+b.q+'</div>'+(b.starters?'<details><summary>Hilfe: Satzanfänge</summary><div class="starters">'+b.starters+'</div></details>':'')+'<details><summary>Musterlösung (erst nach dem Schreiben öffnen)</summary><div>'+b.model+'</div></details></div>';return d;}
 if(b.t==='slider'){const v=(S.sl[b.k]!=null)?S.sl[b.k]:5;d.innerHTML='<div class="q"><div class="qq">'+b.q+'</div><input type="range" min="0" max="10" step="1" value="'+v+'" class="slider" aria-label="Meinung"><div class="sl-l"><span>'+b.l+'</span><span>'+b.m+'</span><span>'+b.r+'</span></div><p class="small" id="slv"></p></div>';
  const inp=d.querySelector('input'),o=d.querySelector('#slv');const upd=()=>{S.sl[b.k]=+inp.value;save();o.textContent=b.out(+inp.value);};b.out=(x=>b.texts?(x<=3?b.texts[0]:x<=6?b.texts[1]:b.texts[2]):'');inp.oninput=upd;upd();return d;}
 return question(b,d);
}
function mark(b,ok){if(!S.ans[b.id]){S.ans[b.id]={first:ok,ok:ok};}else{S.ans[b.id].ok=S.ans[b.id].ok||ok;}save();stepsNav();}
function fb(d,ok,b){const f=d.querySelector('.fb');f.className='fb show '+(ok?'r':'w');f.innerHTML=(ok?'<b>Richtig.</b> ':'<b>Noch nicht.</b> ')+b.ex;}
function question(b,d){
 const q=document.createElement('div');q.className='q';d.appendChild(q);
 const st=S.ans[b.id];const locked=!!st&&!(S.retry&&S.retry.includes(b.id)&&!S.retry_done?.includes(b.id));
 q.innerHTML='<div class="tag">'+({mc:'Wähle eine Antwort',multi:'Mehrere Antworten sind richtig',tf:'Richtig oder falsch?',order:'Tippe in der richtigen Reihenfolge',match:'Tippe zuerst links, dann das Passende rechts'}[b.t])+'</div><div class="qq">'+b.q+'</div><div class="body"></div><div class="fb"></div>';
 const body=q.querySelector('.body');
 if(b.t==='mc'||b.t==='tf'){
  const opts=b.t==='tf'?['richtig','falsch']:b.opts;const ans=b.t==='tf'?(b.a?0:1):b.a;
  const box=document.createElement('div');box.className=b.t==='tf'?'tf':'opts';body.appendChild(box);
  opts.forEach((o,i)=>{const x=document.createElement('button');x.className='opt';x.innerHTML=o;box.appendChild(x);
   if(locked){x.disabled=true;if(i===ans)x.classList.add('right');}
   x.onclick=()=>{const ok=i===ans;box.querySelectorAll('.opt').forEach((y,j)=>{y.disabled=true;if(j===ans)y.classList.add('right');});if(!ok)x.classList.add('wrong');doneQ(b,ok);fb(q,ok,b);};});
  if(locked)fb(q,st.first||st.ok,b);
 }
 if(b.t==='multi'){
  const box=document.createElement('div');box.className='opts';body.appendChild(box);const sel=new Set();
  b.opts.forEach((o,i)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='☐ '+o;box.appendChild(x);
   if(locked){x.disabled=true;if(b.a.includes(i))x.classList.add('right');}
   x.onclick=()=>{if(sel.has(i)){sel.delete(i);x.classList.remove('sel');x.innerHTML='☐ '+o;}else{sel.add(i);x.classList.add('sel');x.innerHTML='☑ '+o;}};});
  if(!locked){const c=document.createElement('button');c.className='btn';c.textContent='Prüfen';c.style.marginTop='10px';body.appendChild(c);
   c.onclick=()=>{const ok=sel.size===b.a.length&&b.a.every(i=>sel.has(i));box.querySelectorAll('.opt').forEach((y,j)=>{y.disabled=true;if(b.a.includes(j))y.classList.add('right');else if(sel.has(j))y.classList.add('wrong');});c.disabled=true;doneQ(b,ok);fb(q,ok,b);};}
  else fb(q,st.first||st.ok,b);
 }
 if(b.t==='order'){
  const box=document.createElement('div');box.className='opts ord';body.appendChild(box);const seq=[];
  const sh=shuffle(b.items.map((x,i)=>i),b.items.length*13+3);
  sh.forEach(i=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="nr"></span>'+b.items[i];x.dataset.i=i;box.appendChild(x);
   if(locked){x.disabled=true;x.querySelector('.nr').textContent=(i+1)+'.';x.classList.add('right');}
   x.onclick=()=>{const k=seq.indexOf(i);if(k>=0){seq.splice(k,1);}else seq.push(i);box.querySelectorAll('.opt').forEach(y=>{const p=seq.indexOf(+y.dataset.i);y.querySelector('.nr').textContent=p>=0?(p+1)+'.':'';y.classList.toggle('sel',p>=0);});c.disabled=seq.length!==b.items.length;};});
  const c=document.createElement('button');c.className='btn';c.textContent='Prüfen';c.style.marginTop='10px';c.disabled=true;
  if(!locked){body.appendChild(c);c.onclick=()=>{const ok=seq.every((v,k)=>v===k);box.querySelectorAll('.opt').forEach(y=>{y.disabled=true;const i=+y.dataset.i;y.querySelector('.nr').textContent=(i+1)+'.';y.classList.add(seq.indexOf(i)===i?'right':'wrong');});c.disabled=true;doneQ(b,ok);fb(q,ok,b);};}
  else fb(q,st.first||st.ok,b);
 }
 if(b.t==='match'){
  const wrap=document.createElement('div');wrap.className='cols';body.appendChild(wrap);
  const L=document.createElement('div');L.className='opts';const R=document.createElement('div');R.className='opts';wrap.appendChild(L);wrap.appendChild(R);
  const map={};let cur=null;const rs=shuffle(b.right.map((x,i)=>i),b.right.length*7+5);
  const lb=b.left.map((t,i)=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<b>'+(i+1)+'</b> '+t;L.appendChild(x);x.onclick=()=>{cur=i;lb.forEach(y=>y.classList.remove('sel'));x.classList.add('sel');};return x;});
  const rb={};rs.forEach(j=>{const x=document.createElement('button');x.className='opt';x.innerHTML='<span class="pair"></span> '+b.right[j];R.appendChild(x);rb[j]=x;
   x.onclick=()=>{if(cur===null)return;for(const k in map){if(map[k]===j)delete map[k];}map[cur]=j;cur=null;lb.forEach(y=>y.classList.remove('sel'));upd();};});
  function upd(){for(const j in rb){const k=Object.keys(map).find(k=>map[k]==j);rb[j].querySelector('.pair').textContent=k!==undefined?'→ '+(+k+1):'';rb[j].classList.toggle('sel',k!==undefined);}c.disabled=Object.keys(map).length!==b.left.length;}
  const c=document.createElement('button');c.className='btn';c.textContent='Prüfen';c.style.marginTop='10px';c.disabled=true;
  if(locked){lb.forEach(x=>x.disabled=true);for(const j in rb){rb[j].disabled=true;rb[j].querySelector('.pair').textContent='→ '+(+j+1);rb[j].classList.add('right');}fb(q,st.first||st.ok,b);}
  else{body.appendChild(c);c.onclick=()=>{let ok=true;b.left.forEach((t,i)=>{if(map[i]!==i)ok=false;});for(const j in rb){const k=Object.keys(map).find(k=>map[k]==j);rb[j].classList.add(+k===+j?'right':'wrong');rb[j].querySelector('.pair').textContent='→ '+(+j+1);rb[j].disabled=true;}lb.forEach(x=>x.disabled=true);c.disabled=true;doneQ(b,ok);fb(q,ok,b);};}
 }
 return d;
}
function doneQ(b,ok){
 if(S.retry&&S.retry.includes(b.id)){S.retry_done=S.retry_done||[];if(!S.retry_done.includes(b.id))S.retry_done.push(b.id);S.ans[b.id].ok=ok;save();stepsNav();return;}
 mark(b,ok);
}
function stufe(p){return p>=85?['A','Sicher']:p>=65?['B','Gut, kleine Lücken']:p>=40?['C','Teilweise – wiederholen']:['D','Noch unsicher – noch einmal üben'];}
function renderResult(){
 const answered=QIDS.filter(q=>S.ans[q.id]).length;
 const first=QIDS.filter(q=>S.ans[q.id]&&S.ans[q.id].first).length;const tot=QIDS.length;
 const after=QIDS.filter(q=>S.ans[q.id]&&S.ans[q.id].ok).length;
 const p=Math.round(100*first/tot);const [L,W]=stufe(p);
 if(answered===tot&&!S.fin){S.fin=new Date().toISOString();save();}
 const dt=S.fin?new Date(S.fin):null;
 let h='<h1>Dein Ergebnis</h1><div class="res"><div class="meta">'+CFG.title+(dt?' · abgeschlossen am '+dt.toLocaleDateString('de-DE')+' um '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr':'')+'</div>';
 if(answered<tot)h+='<p class="warn" style="display:block">Du hast noch '+(tot-answered)+' Frage(n) offen. Beantworte erst alle Fragen, dann zählt dein Ergebnis.</p>';
 h+='<div class="stufe"><div class="shape '+L+'">'+L+'</div><div><div class="big">Stufe '+L+': '+W+'</div><div>1. Versuch: <b>'+first+' von '+tot+' Punkten</b> ('+p+' %)</div>'+(S.retry?'<div>nach Verbesserung: <b>'+after+' von '+tot+' Punkten</b></div>':'')+'</div></div>';
 h+='<table class="et">';E.forEach((e,i)=>{const qs=QIDS.filter(q=>q.et===i);if(!qs.length)return;const r=qs.filter(q=>S.ans[q.id]&&S.ans[q.id].first).length;const ok=r/qs.length>=0.75;h+='<tr><td>Etappe '+(i+1)+' ('+e.title+')</td><td><b>'+r+' von '+qs.length+'</b></td><td>'+(ok?'gut':'wiederhole Etappe '+(i+1)+(e.book?' oder '+e.book:''))+'</td></tr>';});h+='</table>';
 if(L==='A')h+='<p>Sehr gut. Mach weiter mit „Schon fertig?“ auf deinem Blatt oder mit der Bonus-Etappe.</p>';
 h+='<div class="note">Trag Punkte und Stufe auf deinem Arbeitsblatt bei „Mein Ergebnis“ ein. Dann weiter wie auf dem Blatt beschrieben.</div>';
 h+='<div class="navbtns"><button class="btn sec" id="fix">Fehler verbessern</button><button class="btn sec" id="rs">Neu starten</button></div><div class="warn" id="rw">Wirklich alles löschen und neu beginnen? <div class="navbtns"><button class="btn" id="rsy">Ja, neu starten</button><button class="btn sec" id="rsn">Nein</button></div></div></div>';
 if(CFG.bonusIndex!=null)h+='<p style="margin-top:20px"><button class="btn sec" id="bon">Bonus: Schon fertig? →</button></p>';
 if(CFG.next)h+='<a class="cont" href="'+CFG.next.href+'">'+CFG.next.label+' →</a><p class="small" style="text-align:center">'+CFG.next.hint+'</p>';
 app.innerHTML=h;
 const wrong=QIDS.filter(q=>S.ans[q.id]&&!S.ans[q.id].ok);
 const fx=document.getElementById('fix');if(!wrong.length||answered<tot){fx.disabled=true;}
 fx.onclick=()=>{S.retry=(S.retry||[]).concat(wrong.map(q=>q.id).filter(id=>!(S.retry||[]).includes(id)));S.retry_done=(S.retry_done||[]).filter(id=>!wrong.map(q=>q.id).includes(id));save();renderRetry(wrong);};
 document.getElementById('rs').onclick=()=>{document.getElementById('rw').style.display='block';};
 document.getElementById('rsn').onclick=()=>{document.getElementById('rw').style.display='none';};
 document.getElementById('rsy').onclick=()=>{S={st:0,ans:{},done:false,fin:null,retry:null,heft:{},sl:{}};save();render();};
 const bo=document.getElementById('bon');if(bo)bo.onclick=()=>{S.st=CFG.bonusIndex;save();render();};
}
function renderRetry(list){
 app.innerHTML='<h1>Fehler verbessern</h1><p class="lead">Hier stehen nur die Fragen, die im 1. Versuch falsch waren. Dein Ergebnis im 1. Versuch bleibt gespeichert.</p>';
 list.forEach(b=>{const d=document.createElement('div');d.className='blk';app.appendChild(question(b,d));});
 const nb=document.createElement('div');nb.className='navbtns';const x=document.createElement('button');x.className='btn';x.textContent='Zurück zum Ergebnis';x.onclick=()=>{S.st=E.length;save();render();};nb.appendChild(x);app.appendChild(nb);
}
document.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT')return;if(ev.key==='ArrowRight'&&S.st<E.length){S.st++;save();render();}if(ev.key==='ArrowLeft'&&S.st>0){S.st--;save();render();}});
render();
</script>
</body>
</html>
