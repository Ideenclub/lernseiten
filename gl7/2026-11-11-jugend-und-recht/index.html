<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL 7 · Jugend und Recht</title>
<style>
:root{--ink:#1c2233;--teal:#0f6e6e;--coral:#e8603c;--ind:#2a2c6b;--amb:#f0a21a;--bg:#f4f1ec;--card:#fff;--ok:#2f9a5a;--no:#cf3f3f;--grey:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{letter-spacing:.06em;font-size:14px}
#pts{background:var(--amb);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:700;font-size:15px}
.bar{height:8px;background:#ddd}.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .5s}
main{max-width:860px;margin:0 auto;padding:22px 18px 60px}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.07);margin-bottom:20px}
h1{font-size:34px;margin:.2em 0;line-height:1.15}h2{font-size:25px;margin:.1em 0 .5em}
.kick{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--coral);text-transform:uppercase}
.hero{width:100%;border-radius:18px;display:block;aspect-ratio:16/7;object-fit:cover}
.btn{display:inline-block;border:0;border-radius:16px;padding:16px 26px;font-size:19px;font-weight:700;cursor:pointer;min-height:56px;background:var(--ink);color:#fff;margin:6px 6px 0 0}
.btn.t1{background:var(--teal)}.btn.t2{background:var(--ind)}.btn[disabled]{opacity:.35}
.q{border-top:2px dashed #e4e0d8;padding-top:16px;margin-top:18px}
.q p{font-weight:700;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;border:2px solid #d9d4ca;background:#fff;border-radius:14px;padding:14px 16px;font-size:18px;margin:8px 0;min-height:52px;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#e6f5ec}.opt.no{border-color:var(--no);background:#fbe9e9}
.fb{border-radius:12px;padding:10px 14px;margin-top:6px;font-size:17px;display:none}
.fb.ok{display:block;background:#e6f5ec}.fb.no{display:block;background:#fbe9e9}
.sheet{background:#fff6e8;border-left:6px solid var(--amb);border-radius:12px;padding:12px 16px;margin-top:16px;font-size:17px}
.book{background:#ecebf7;border-left:6px solid var(--ind);border-radius:12px;padding:12px 16px;margin-top:16px;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:16px}th{background:var(--teal);color:#fff;padding:8px;font-size:14px}td{padding:8px;border-bottom:1px solid #eee}
.chip{display:inline-block;border-radius:20px;padding:3px 10px;font-weight:700;font-size:14px;color:#fff;white-space:nowrap}
.r{background:var(--no)}.g{background:var(--ok)}.y{background:var(--amb);color:var(--ink)}
.tl{display:flex;height:64px;border-radius:14px;overflow:hidden;margin:18px 0 6px}
.tl div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center;padding:4px;transform:scaleX(0);transform-origin:left;animation:grow .7s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.ages{display:flex;font-weight:700;font-size:15px;color:var(--grey)}
.chat{background:#fff;border-radius:18px 18px 18px 4px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:560px}
.score{font-size:64px;font-weight:800;color:var(--coral);line-height:1}
.foot{font-size:12px;color:var(--grey);margin-top:30px}
@media (max-width:600px){body{font-size:17px}h1{font-size:28px}table{font-size:14px}}
</style>
</head>

 {h:"Ein Gesetz zu deinem Schutz",c:`<p>Das <b>Jugendschutzgesetz</b> (JuSchG) gilt in ganz Deutschland. Es schützt Kinder und Jugendliche in der <b>Öffentlichkeit</b>: im Kino, in der Disco oder im Supermarkt.</p><p>Die Regeln hängen vom <b>Alter</b> ab. <b>Kinder</b> sind unter 14. <b>Jugendliche</b> sind 14 bis 17.</p><p>Wird eine Regel gebrochen, bekommt meist der <b>Erwachsene</b> Ärger – zum Beispiel der Kinobetreiber.</p>`,
  q:[{p:"Wo gilt das Jugendschutzgesetz?",o:["Nur in NRW","In ganz Deutschland","Nur in der Schule"],a:1,e:"Es ist ein Bundesgesetz – es gilt überall in Deutschland."},
     {p:"Du bist 13. Was bist du laut Gesetz?",o:["ein Kind","ein Jugendlicher","ein Erwachsener"],a:0,e:"Kinder sind unter 14 Jahre alt."},
     {p:"Ein Kino lässt eine 12-Jährige um 22 Uhr allein in den Film. Wer bekommt Ärger?",o:["die 12-Jährige","das Kino","niemand"],a:1,e:"Meist ist der Erwachsene verantwortlich – hier der Kinobetreiber."}]},
 {h:"Die Ampel-Tabelle",c:ampel+`<div class="sheet">Auf dem Blatt: Mach jetzt <b>Aufgabe 1</b> (Lückentext).</div>`,
  q:[{p:"Du bist 15. Bis wann darfst du ohne Eltern ins Kino?",o:["bis 20 Uhr","bis 22 Uhr","bis 24 Uhr"],a:1,e:"14- und 15-Jährige: bis 22 Uhr."},
     {p:"Darf eine 16-Jährige Bier kaufen?",o:["ja","nein"],a:0,e:"Bier, Wein und Sekt: ab 16 erlaubt."},
     {p:"Darf ein 14-Jähriger ohne Eltern in die Disco?",o:["ja, bis 24 Uhr","nein"],a:1,e:"Ohne Eltern in die Disco erst ab 16."},
     {p:"Darf eine 17-Jährige E-Zigaretten kaufen?",o:["ja","nein"],a:1,e:"Rauchen und E-Zigaretten: erst ab 18."}]},
 {h:"Emre braucht Hilfe",c:`<div class="chat"><b>Emre (13):</b> Hey! Ich will heute mit Lina ins Kino. Der Film ist ab 12 und endet um 22 Uhr. Meine Mutter sagt, mit 13 darf ich so spät nicht ohne sie ins Kino. Stimmt das??</div><div class="book">Im Buch: S. 200, M1 – Emres Problem.</div>`,
  q:[{p:"Hat Emres Mutter recht?",o:["Ja – mit 13 nur bis 20 Uhr ohne Eltern.","Nein – der Film ist ja ab 12."],a:0,e:"Die Altersfreigabe passt, aber die Uhrzeit nicht: Kinder ohne Eltern nur bis 20 Uhr."},
     {p:"Welcher Tipp hilft Emre wirklich?",o:["Heimlich hingehen","Mit Mutter oder Vater gehen oder eine frühere Vorstellung wählen","Sich älter machen"],a:1,e:"Mit Begleitung der Eltern oder früher am Abend ist es erlaubt."}],
  s:"Auf dem Blatt: Schreib Emre jetzt deine Antwort in den Chat (<b>Aufgabe 2</b>)."},
 {h:"Abschluss-Check Teil 1",c:`<p>Zeig, was du kannst! Danach machst du <b>Aufgabe 3</b> auf dem Blatt.</p>`,
  q:[{p:"Warum gibt es das Jugendschutzgesetz?",o:["Damit Kinos mehr verdienen","Um die Gesundheit von Kindern und Jugendlichen zu schützen","Damit Erwachsene mehr Spaß haben"],a:1,e:"Es schützt vor Alkohol, Rauch und Gefahren in der Nacht."},
     {p:"Ab wann darf man in eine Spielhalle?",o:["ab 16","ab 18"],a:1,e:"Spielhallen und Glücksspiel: erst ab 18."},
     {p:"Schnaps darf man kaufen …",o:["ab 16","ab 18"],a:1,e:"Getränke mit viel Alkohol: erst ab 18."},
     {p:"Freitag, 21:30 Uhr, du bist 13, ohne Eltern: Darfst du in den Film?",o:["ja","nein"],a:1,e:"Mit 13 ohne Eltern nur bis 20 Uhr."}]}
]},
2:{name:"Teil 2 – Doppelstunde",title:"Ab 14 wird's ernst!",col:"var(--ind)",steps:[
 {h:"Ist das eine Straftat?",c:`<img class="hero" src="${IMG2}" alt="Justitia-Statue"><p>Eine <b>Straftat</b> ist eine Tat, die im <b>Strafgesetzbuch (StGB)</b> verboten ist. Wer sie begeht, kann bestraft werden. Teste dein Bauchgefühl!</p>`,
  q:[{p:"Lukas steckt im Supermarkt Kaugummi ein, ohne zu bezahlen.",o:["Straftat","keine Straftat"],a:0,e:"Das ist Diebstahl."},
     {p:"Mia vergisst ihre Hausaufgaben.",o:["Straftat","keine Straftat"],a:1,e:"Ärgerlich – aber keine Straftat."},
     {p:"Ben sprüht ohne Erlaubnis Graffiti an die Schulwand.",o:["Straftat","keine Straftat"],a:0,e:"Das ist Sachbeschädigung."},
     {p:"Tom schlägt einen Mitschüler. Der wird verletzt.",o:["Straftat","keine Straftat"],a:0,e:"Das ist Körperverletzung."},
     {p:"Sara (13) bleibt ohne Eltern bis 22 Uhr im Kino.",o:["Straftat","keine Straftat"],a:1,e:"Keine Straftat. Gegen das Jugendschutzgesetz verstößt hier das Kino."},
     {p:"Can beleidigt eine Mitschülerin im Chat mit Schimpfwörtern.",o:["Straftat","keine Straftat"],a:0,e:"Das ist Beleidigung."}],
  s:"Auf dem Blatt: Kreuze <b>Aufgabe 1</b> an und lies den Merke-Kasten."},
 {h:"Wie alt – welches Recht?",c:tl+`<div class="ages"><span style="flex:4">0</span><span style="flex:2">14</span><span style="flex:2">18</span><span style="flex:2">21</span></div>
<p><b>Unter 14</b> ist man <b>strafunmündig</b>: Kein Gericht kann ein Kind bestrafen. Die Polizei nimmt den Fall aber auf, oft kommen Jugendamt und Eltern dazu.</p>
<p><b>Ab 14</b> ist man <b>strafmündig</b>. Für 14- bis 17-Jährige gilt das <b>Jugendstrafrecht</b>: Erziehung ist besonders wichtig. Bedingung: Man konnte verstehen, dass die Tat Unrecht ist.</p>
<p><b>18 bis 20</b>: oft noch Jugendstrafrecht – das Gericht entscheidet. <b>Ab 21</b>: immer Erwachsenenstrafrecht.</p><div class="book">Im Buch: S. 205, M9 – Stufen der Strafmündigkeit.</div>`,
  q:[{p:"Ab welchem Alter ist man strafmündig?",o:["ab 12","ab 14","ab 18"],a:1,e:"Strafmündig ist man ab 14 Jahren."},
     {p:"Was steht im Jugendstrafrecht besonders im Vordergrund?",o:["Erziehung","Rache","hohe Geldstrafen"],a:0,e:"Jugendliche sollen lernen und sich ändern."},
     {p:"Ab 21 Jahren gilt …",o:["das Jugendstrafrecht","das Erwachsenenstrafrecht"],a:1,e:"Ab 21 immer Erwachsenenstrafrecht."}],
  s:"Auf dem Blatt: Male den Zeitstrahl an und beschrifte ihn (<b>Aufgabe 2</b>)."},
 {h:"Strafmündig oder nicht?",c:`<p>Jetzt bist du Jugendrichter-Profi. Arbeite danach mit deinem Partner an <b>Aufgabe 3</b>.</p>`,
  q:[{p:"Jana (13) klaut eine Handyhülle.",o:["strafmündig","strafunmündig"],a:1,e:"Mit 13 ist Jana noch strafunmündig – kein Gericht kann sie bestrafen."},
     {p:"Murat (15) sprüht Graffiti auf einen Zug. Was gilt?",o:["Jugendstrafrecht","Erwachsenenstrafrecht","nichts"],a:0,e:"15 Jahre: strafmündig, Jugendstrafrecht."},
     {p:"Kevin (19) stiehlt ein Fahrrad. Was gilt?",o:["immer Erwachsenenstrafrecht","Jugend- oder Erwachsenenstrafrecht – das Gericht entscheidet"],a:1,e:"Kevin ist Heranwachsender (18–20)."}],
  s:"Auf dem Blatt: <b>Aufgabe 3</b> mit Partner + Buch-Check S. 204, M6."},
 {h:"Deine Meinung",c:`<p style="font-size:22px;font-weight:700">„Schon 12-Jährige sollten vor Gericht bestraft werden.“</p><p><b>Pro:</b> Manche Kinder begehen schon schwere Taten. Die Opfer wollen Gerechtigkeit.<br><b>Contra:</b> Kinder verstehen die Folgen oft noch nicht. Hilfe und Erziehung ändern ein Kind mehr als Strafe.</p>`,
  q:[{t:"op",p:"Was meinst du?",o:["Ich stimme zu.","Ich bin unsicher.","Ich stimme nicht zu."]}],
  s:"Auf dem Blatt: Kreuz auf die Linie + Begründung mit „weil“ (<b>Aufgabe 4</b>). Danach: <b>Aufgabe 5</b> Erklär-Post mit Partner."},
 {h:"Abschluss-Quiz Teil 2",c:`<p>Letzte Runde – sammle alle Punkte!</p>`,
  q:[{p:"Eine Straftat ist …",o:["jede Regel, die man in der Schule bricht","eine Tat, die im Strafgesetzbuch verboten ist"],a:1,e:"Straftaten stehen im Strafgesetzbuch (StGB)."},
     {p:"Ein 13-Jähriger stiehlt. Was stimmt?",o:["Ein Gericht bestraft ihn.","Kein Gericht kann ihn bestrafen – aber Polizei und Jugendamt kümmern sich."],a:1,e:"Unter 14: strafunmündig."},
     {p:"Für einen Schaden (z. B. kaputte Scheibe) haften kann man schon ab …",o:["7 Jahren","14 Jahren","18 Jahren"],a:0,e:"Ab 7, wenn man verstehen konnte, dass es falsch war (Buch S. 205, M8)."},
     {p:"Wer entscheidet, ob ein 19-Jähriger nach Jugendstrafrecht verurteilt wird?",o:["die Eltern","das Gericht","die Polizei"],a:1,e:"Bei Heranwachsenden entscheidet das Gericht."},
     {p:"Für 14- bis 17-Jährige gilt …",o:["das Jugendstrafrecht","das Erwachsenenstrafrecht"],a:0,e:"Jugendliche: Jugendstrafrecht."}]}
]}};
let st={part:0,step:0,pts:{1:0,2:0},max:{1:0,2:0}};
try{const s=JSON.parse(localStorage.getItem("gl7-recht"));if(s&&s.pts)st=s;}catch(e){}
function save(){try{localStorage.setItem("gl7-recht",JSON.stringify(st));}catch(e){}}
const app=document.getElementById("app");
function setPts(){document.getElementById("pts").textContent=(st.part?st.pts[st.part]:0)+" Punkte";}
function home(){st.part=0;save();document.getElementById("prog").style.width="0";setPts();
 app.innerHTML=`<div class="card"><div class="kick">GL 7 · Jugend und Recht</div><h1>Wer darf was – und wer muss geradestehen?</h1>
 <p>Arbeite Schritt für Schritt. Nach jeder Etappe beantwortest du Fragen und bekommst sofort eine Rückmeldung. Die orangen Kästen sagen dir, was du auf dem <b>Arbeitsblatt</b> festhältst.</p>
 <button class="btn t1" onclick="go(1)">Teil 1 – Was darf ich mit 13?</button>
 <button class="btn t2" onclick="go(2)">Teil 2 – Ab 14 wird's ernst!</button></div>
 <p class="foot">Fotos: Jake Hills / Unsplash · Tingey Injury Law Firm / Unsplash · Schulbuch: #Gesellschaftslehre 7/8, C.C. Buchner</p>`;}
function go(p){if(st.part!==p){st.part=p;st.step=0;st.pts[p]=0;st.max[p]=0;}save();show();}
function show(){const P=T[st.part],S=P.steps[st.step];setPts();
 document.getElementById("prog").style.width=(100*st.step/P.steps.length)+"%";
 let h=`<div class="card"><div class="kick" style="color:${P.col}">${P.name} · Etappe ${st.step+1} von ${P.steps.length}</div><h2>${S.h}</h2>${S.c}`;
 S.q.forEach((q,i)=>{h+=`<div class="q" id="q${i}"><p>${q.p}</p>${q.o.map((o,j)=>`<button class="opt" onclick="ans(${i},${j})">${o}</button>`).join("")}<div class="fb" id="f${i}"></div></div>`;});
 if(S.s)h+=`<div class="sheet" id="sh" style="display:none">${S.s}</div>`;
 h+=`<button class="btn" id="nx" disabled onclick="next()" style="margin-top:18px;background:${P.col}">${st.step+1<P.steps.length?"Weiter":"Ergebnis ansehen"}</button></div>`;
 app.innerHTML=h;window.scrollTo(0,0);S.done=new Set();}
function ans(i,j){const S=T[st.part].steps[st.step],q=S.q[i];if(S.done.has(i))return;S.done.add(i);
 const bs=document.querySelectorAll(`#q${i} .opt`),f=document.getElementById("f"+i);
 if(q.t==="op"){bs[j].classList.add("ok");f.className="fb ok";f.textContent="Danke! Hier gibt es kein Richtig oder Falsch.";}
 else{st.max[st.part]++;if(j===q.a){st.pts[st.part]++;bs[j].classList.add("ok");f.className="fb ok";f.innerHTML="<b>Richtig!</b> "+q.e;}
  else{bs[j].classList.add("no");bs[q.a].classList.add("ok");f.className="fb no";f.innerHTML="<b>Nicht ganz.</b> "+q.e;}}
 setPts();save();if(S.done.size===S.q.length){document.getElementById("nx").disabled=false;const sh=document.getElementById("sh");if(sh)sh.style.display="block";}}
function next(){const P=T[st.part];st.step++;save();if(st.step<P.steps.length)show();else end();}
function end(){const p=st.part,P=T[p];document.getElementById("prog").style.width="100%";
 const pc=st.max[p]?Math.round(100*st.pts[p]/st.max[p]):0;
 app.innerHTML=`<div class="card" style="text-align:center"><div class="kick">${P.name} geschafft</div><h2>${P.title}</h2>
 <div class="score">${st.pts[p]} / ${st.max[p]}</div><p>${pc>=80?"Stark! Du bist fit.":pc>=50?"Gut gemacht! Schau dir die Fehler noch einmal an.":"Schau dir die Etappen noch einmal an – du schaffst das!"}</p>
 <div class="sheet" style="text-align:left"><b>Zeig dieses Ergebnis deiner Lehrkraft.</b><br>${p===1?"Dann geht es auf dem Arbeitsblatt mit Aufgabe 3 weiter.":"Dann machst du die Profi-Aufgabe auf dem Blatt."}</div>
 <button class="btn" onclick="home()">Zur Übersicht</button>${p===1?'<button class="btn t2" onclick="go(2)">Weiter zu Teil 2</button>':""}</div>`;}
if(st.part&&T[st.part]&&st.step<T[st.part].steps.length)show();else home();
</script>
