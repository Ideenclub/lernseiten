:root{--ink:#16312d;--green:#176354;--light:#e5efeb;--orange:#a74421}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f2f5f3;font:19px/1.65 system-ui,sans-serif}header{background:var(--ink);color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:15px}header b{letter-spacing:.09em}button,select,input,textarea{font:inherit}button,a,summary,input,select{touch-action:manipulation}button{min-height:48px;border:1px solid var(--green);background:var(--green);color:white;padding:10px 18px;border-radius:4px;cursor:pointer}button:hover{filter:brightness(.9)}button:disabled{opacity:.45;cursor:default}.secondary{background:white;color:var(--ink)}a{color:var(--green)}:focus-visible{outline:3px solid #d47417;outline-offset:4px}nav{padding:12px 5vw;background:white;border-bottom:1px solid #bdcec5;position:sticky;top:0;z-index:4;display:flex;gap:12px;align-items:center}select{padding:10px;max-width:100%;min-width:0;border:1px solid #8fa79b;background:white;color:var(--ink);border-radius:4px}nav select{flex:1}main{max-width:960px;padding:30px 28px 120px;margin:auto}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.14;letter-spacing:-.03em;margin:12px 0 25px}h2{font-size:1.65rem;line-height:1.2}h3{font-size:1.2rem;line-height:1.3;margin-top:28px}.lead{font-size:1.22rem;max-width:780px}.body{max-width:850px}.body p{max-width:75ch}.eyebrow{color:var(--green);font-weight:700;font-size:.95rem}.experiment{padding:25px;background:white;border:1px solid #becfc5;margin:25px 0}.experiment button{margin:5px 4px 5px 0}.heroart{display:grid;grid-template-columns:140px 1fr;gap:8px;background:var(--ink);padding:25px;color:white}.heroart span{color:#9ed6bf;font-size:.82rem;align-self:center}.heroart b{font-size:1.35rem}.tasks{border-top:4px solid var(--orange);margin-top:28px;background:white;padding:24px}li{padding:5px 0}textarea{display:block;width:100%;min-height:150px;padding:14px;border:1px solid #8fa79b;border-radius:3px;resize:vertical;background:#fff}label{display:block;font-weight:600}input[type=range]{display:block;width:100%;min-height:48px;accent-color:var(--green)}output{display:block;font-weight:700}details{background:#fff;border:1px solid #bdcec5;margin:15px 0;padding:14px 20px}summary{cursor:pointer;min-height:35px;font-weight:650}.small{font-size:.9rem;color:#465d52}.bigresult{padding:20px;background:var(--light);margin:15px 0;font-size:1.15rem}.bigresult strong{font-size:1.6rem}.squares{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:18px 0}.square{height:24px;background:#cbd9d0;transition:background .3s}.square.mine{background:var(--green)}.track{height:22px;background:#d4ddd7;overflow:hidden}.track div{height:100%;background:var(--green);transition:width .4s}.flow{padding:20px;border-left:5px solid var(--green);margin:18px 0}.cases{display:grid;grid-template-columns:1fr 1fr;gap:20px}.cases article{padding:20px;background:white;border-top:4px solid var(--green)}.check{padding:20px;border-left:5px solid #a74421;background:#fff3e9;margin:25px 0}.bottom{position:fixed;bottom:0;background:#fff;z-index:5;border-top:1px solid #bdcec5;padding:10px 5vw;display:flex;justify-content:space-between;width:100%;gap:12px;align-items:center}.done{display:flex;align-items:center;gap:10px;padding:20px 0}.done input{width:24px;height:24px}.q{padding:20px;background:white;border:1px solid #bdcec5;margin:20px 0}.q button{display:block;width:100%;margin:8px 0;text-align:left}.feedback{border-left:4px solid var(--green);padding:12px;background:var(--light)}.map button{display:block;text-align:left;width:100%;margin:10px 0}.journal pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}blockquote{padding:20px;border-left:4px solid var(--orange);background:white;margin:15px 0}#status{font-size:.85rem}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #bbcabe;padding:10px;text-align:left}footer{font-size:.85rem;border-top:1px solid #bccdc1;margin-top:35px;padding-top:15px;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:600px){body{font-size:17px}main{padding:22px 18px 120px}header{padding:15px 18px}header span{display:none}nav{padding:10px}.cases{grid-template-columns:1fr}.heroart{grid-template-columns:100px 1fr;padding:18px}.heroart b{font-size:1.1rem}.tasks,.experiment{padding:18px}.bottom{padding:10px}.bottom span{font-size:.8rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{header,nav,.bottom,button,.done{display:none}main{padding:0}textarea{height:auto}body{background:white}}
</style></head><body><header><b>WiPo 10 · Aktien</b><span>Verstehen und begründet entscheiden</span></header><nav aria-label="Lernweg"><button class="secondary" onclick="showMap()">Übersicht</button><select id="route" aria-label="Station wählen"></select><button class="secondary" onclick="journal()">Ergebnisse</button></nav><main id="main"></main><div class="bottom"><button id="prev" class="secondary" onclick="go(current-1)">Zurück</button><span id="position"></span><button id="next" onclick="go(current+1)">Weiter</button></div><script>
const stations=[{"title": "Wie funktionieren Aktien?", "lead": "Ein Spiel kaufen oder einen Anteil am Unternehmen besitzen: Das ist nicht dasselbe.", "body": "<div class=\"heroart\"><span>PRODUKT</span><b>Spiel</b><span>UNTERNEHMEN</span><b>stellt Spiele her</b><span>AKTIE</span><b>Anteil am Unternehmen</b></div><p>In der letzten Stunde ging es um Vorsorge: heute an später denken. Hier untersuchst du, welche Rolle Aktien dabei spielen können.</p><p>Du lernst, was eine Aktie ist, wie Gewinne und Verluste entstehen und warum Geld für nächste Woche anders angelegt wird als Geld fürs Alter.</p><h3>So arbeitest du</h3><ol><li>Lies die Erklärung. Probiere dann das Modell aus.</li><li>Bearbeite die nummerierten Aufgaben im Antwortfeld. Du kannst stattdessen ins Heft schreiben.</li><li>Nutze bei Bedarf „Denkhilfe“. Vergleiche erst nach deiner eigenen Antwort.</li><li>Gehe mit „Weiter“ zur nächsten Station. Im Menü findest du alle Stationen und deine Ergebnisse.</li></ol><p>Allein: Bearbeite alles selbst. Zu zweit: Eine Person bedient, die andere erklärt. Tauscht nach jeder Station. Schreibt eure Gedanken gemeinsam auf.</p><p>Keine Namen und keine privaten Geldbeträge eingeben. Du brauchst weder eine Trading-App noch echtes Geld.</p>", "tasks": ["Nenne etwas, wofür Menschen Geld für später zurücklegen.", "Vermute: Was könnte der Unterschied zwischen einem Spiel und einer Aktie sein?"], "tip": "Denke an Reparaturen, große Anschaffungen oder das Leben im Alter. Satzanfang: „Bei einer Aktie vermute ich …“", "sample": "Deine Vermutung darf noch ungenau sein. Am Ende kehrst du zu ihr zurück."}, {"title": "Ein kleines Stück Unternehmen", "lead": "Eine Aktie ist ein Anteil an einem Unternehmen. Wer Aktien besitzt, ist an diesem Unternehmen beteiligt.", "body": "<p>Unser erfundenes Unternehmen heißt <b>Pixelwerk AG</b>. Es stellt Spiele her. Im Modell gibt es insgesamt 100 gleich große Aktien. Jede Aktie steht für einen von 100 Anteilen.</p><p>Du kaufst damit kein Spiel und keinen bestimmten Computer der Firma. Du besitzt einen Anteil am gesamten Unternehmen.</p><label for=\"shares\">Wie viele der 100 Aktien besitzt du?</label><input id=\"shares\" type=\"range\" min=\"0\" max=\"100\" value=\"10\" step=\"1\"><output id=\"sharesout\"></output><div id=\"squares\" class=\"squares\" aria-hidden=\"true\"></div><p>Farbige Felder: deine Anteile. Helle Felder: Anteile anderer Personen.</p>", "tasks": ["Stelle zuerst 10, dann 25 und dann 50 Aktien ein. Beschreibe, wie sich dein Anteil verändert.", "Erkläre einer Person ohne Vorwissen das Wort Aktie in zwei Sätzen. Nutze das Beispiel Pixelwerk."], "tip": "100 Anteile sind das ganze Unternehmen. 50 von 100 sind die Hälfte. Satzanfang: „Eine Aktie ist … Wenn ich 10 von 100 Aktien besitze, …“", "sample": "Eine Aktie ist ein Anteil an einem Unternehmen. Im Modell gehören mir bei 10 Aktien zehn von hundert Anteilen; bei 50 Aktien die Hälfte. Bei echten großen Unternehmen gibt es meist viel mehr als 100 Aktien."}, {"title": "Wohin geht das Geld?", "lead": "Unternehmen können neue Aktien ausgeben, um Geld zu erhalten. Bereits vorhandene Aktien werden auch zwischen Anlegern gehandelt.", "body": "<p><b>Anleger</b> sind Menschen oder Organisationen, die Geld anlegen. Sie hoffen, dass daraus mehr Geld wird. Das kann auch schiefgehen.</p><div class=\"experiment\"><button onclick=\"flow(0)\">Neue Aktien</button> <button onclick=\"flow(1)\">Weiterverkauf</button><div id=\"flow\" class=\"flow\" aria-live=\"polite\"></div></div><p>Eine <b>Börse</b> ist ein organisierter Handelsplatz. Dort werden unter anderem Aktien gekauft und verkauft. Der vereinbarte Preis einer Aktie heißt <b>Kurs</b>.</p>", "tasks": ["Klicke beide Fälle an. Schreibe auf, wer jeweils das Geld erhält.", "Eine Freundin sagt: „Wenn ich an der Börse eine Aktie kaufe, bekommt immer die Firma mein Geld.“ Verbessere den Satz."], "tip": "Unterscheide neue Aktien von einer Aktie, die bereits jemand besitzt. Satzanfang: „Beim Weiterverkauf erhält …“", "sample": "Bei der Ausgabe neuer Aktien erhält das Unternehmen Geld. Beim gewöhnlichen Weiterverkauf erhält die verkaufende Person den Kaufpreis. Nicht jeder Kauf an der Börse bringt dem Unternehmen direkt neues Geld."}, {"title": "Was passiert mit deinen 100 Euro?", "lead": "Du kaufst im Modell 10 Aktien. Jede kostet 10 Euro. Insgesamt gibst du 100 Euro aus.", "body": "<p>Der Kurs kann steigen oder fallen. Die Anzahl deiner Aktien bleibt hier gleich. Erst wenn du verkaufst, wird aus dem angezeigten Wert ein Verkaufserlös.</p><label for=\"price\">Neuer Kurs je Aktie in Euro</label><input id=\"price\" type=\"range\" min=\"0\" max=\"20\" value=\"10\" step=\"1\"><output id=\"priceout\"></output><div id=\"priceResult\" class=\"bigresult\" aria-live=\"polite\"></div><div class=\"track\"><div id=\"pricebar\"></div></div><p class=\"small\">Erfundenes Rechenmodell. Gebühren, Steuern und Ausschüttungen bleiben hier weg. Auch ein vollständiger Verlust ist möglich.</p>", "tasks": ["Vermute zuerst: Was sind deine 10 Aktien bei einem Kurs von 8 Euro wert? Prüfe mit dem Regler.", "Probiere 12 Euro und 5 Euro aus. Notiere jeweils Gesamtwert und Gewinn oder Verlust gegenüber deinen 100 Euro.", "Schreibe eine Warnung für jemanden, der glaubt: „Bei Aktien kann mein Geld nur mehr werden.“"], "tip": "Rechne Anzahl × Kurs. Beispiel: 10 Aktien × 9 Euro = 90 Euro. Satzanfang: „Wenn der Kurs fällt, …“", "sample": "Bei 8 Euro sind es 80 Euro, also 20 Euro weniger. Bei 12 Euro: 120 Euro und 20 Euro mehr. Bei 5 Euro: 50 Euro und 50 Euro weniger. Aktien können an Wert verlieren. Ein späterer Anstieg ist nicht garantiert."}, {"title": "Warum ändern sich Kurse?", "lead": "Menschen kaufen und verkaufen nach ihren Erwartungen. Sie wissen nicht sicher, wie ein Unternehmen sich entwickeln wird.", "body": "<p>Wenn mehr Menschen eine Aktie kaufen wollen und dafür höhere Preise bieten, kann der Kurs steigen. Wollen viele verkaufen und akzeptieren niedrigere Preise, kann er fallen.</p><div class=\"experiment\"><p><b>Pixelwerk: drei erfundene Nachrichten</b></p><button onclick=\"news(0)\">Viele Vorbestellungen</button> <button onclick=\"news(1)\">Entwicklung wird teurer</button> <button onclick=\"news(2)\">Ein Konkurrent überrascht</button><p id=\"news\" aria-live=\"polite\">Vermute zuerst für jede Nachricht: Was könnten Anleger denken? Öffne dann die Erklärung.</p></div><p><b>Erwartung</b> bedeutet: etwas für die Zukunft vermuten. Eine gute Nachricht kann schon im Kurs enthalten sein. Deshalb ist auch nach guten Nachrichten ein Kursverlust möglich.</p>", "tasks": ["Wähle zwei Nachrichten. Erkläre jeweils, warum Menschen kaufen oder verkaufen könnten.", "Erfinde eine eigene Nachricht zu Pixelwerk. Schreibe dazu eine mögliche Reaktion. Verwende „könnte“, nicht „wird sicher“."], "tip": "Denke an Einnahmen, Kosten oder andere Anbieter. Satzanfang: „Menschen könnten verkaufen, weil sie befürchten, dass …“", "sample": "Höhere Entwicklungskosten können die Hoffnung auf Gewinne senken. Viele Vorbestellungen können Hoffnungen stärken. Keine dieser Nachrichten legt den nächsten Kurs sicher fest: Entscheidend ist auch, was zuvor erwartet wurde."}, {"title": "Spielehit gleich Aktiengewinn?", "lead": "GTA VI ist ein Spiel von Rockstar Games. Rockstar Games gehört zu Take-Two Interactive. Eine Take-Two-Aktie ist ein Unternehmensanteil, keine separate GTA-Aktie.", "body": "<p>Das reale Beispiel hilft, Produkt und Unternehmen zu unterscheiden. Es ist keine Empfehlung für ein Spiel oder eine Geldanlage.</p><p>Eine Firma erhält Geld durch Verkäufe: Das sind <b>Einnahmen</b>. Für Personal und Entwicklung gibt sie Geld aus: Das sind <b>Kosten</b>. Bleibt nach Abzug aller Kosten etwas übrig, ist das <b>Gewinn</b>.</p><div class=\"experiment\"><p>Ab hier wieder erfunden: Pixelwerk nimmt 100 Euro ein.</p><label for=\"cost\">Kosten in Euro</label><input id=\"cost\" type=\"range\" min=\"40\" max=\"140\" value=\"70\" step=\"10\"><output id=\"costout\"></output><div id=\"profit\" class=\"bigresult\" aria-live=\"polite\"></div></div><p>Ein Unternehmen kann einen Teil seines Gewinns an Aktionäre auszahlen. Diese Zahlung heißt <b>Dividende</b>. Sie ist nicht garantiert.</p>", "tasks": ["Stelle die Kosten auf 60 und danach auf 120 Euro. Erkläre den Unterschied.", "Antworte auf die Behauptung: „Alle lieben das Spiel. Deshalb bringt die Aktie sicher Gewinn.“ Schreibe drei kurze Sätze."], "tip": "1. Ein beliebtes Spiel kann … 2. Trotzdem entstehen … 3. Der Aktienkurs ist nicht sicher, weil …", "sample": "Bei 60 Euro Kosten bleiben 40 Euro Gewinn. Bei 120 Euro Kosten entsteht ein Verlust von 20 Euro. Ein beliebtes Spiel kann Einnahmen bringen; Kosten und Erwartungen zählen ebenfalls. Deshalb garantiert ein Spielehit keinen Aktiengewinn."}, {"title": "Warum ist Verteilen wichtig?", "lead": "Alles auf ein Unternehmen zu setzen, macht dich stark von diesem Unternehmen abhängig. Verteilen heißt: Geld auf mehrere Anlagen aufteilen.", "body": "<p>Du vergleichst zwei erfundene Anlagen von jeweils 100 Euro: A enthält nur Pixelwerk. B enthält je 25 Euro in vier Unternehmen aus verschiedenen Bereichen.</p><div class=\"experiment\"><button onclick=\"risk(0)\">Ein Unternehmen fällt stark</button> <button onclick=\"risk(1)\">Alle vier verlieren</button><div id=\"risk\" aria-live=\"polite\"></div></div><p>Ein <b>Fonds</b> bündelt Geld und legt es zum Beispiel in viele Aktien an. Ein <b>ETF</b> ist ein an der Börse gehandelter Fonds. Viele ETFs bilden einen Aktienindex nach: eine festgelegte Gruppe von Aktien. Nicht jeder ETF ist breit verteilt.</p><p>Ein breit verteilter Aktien-ETF kann das Risiko einzelner Unternehmen verringern. Auch er kann deutlich an Wert verlieren.</p>", "tasks": ["Öffne den ersten Fall. Vergleiche A und B mit zwei Zahlen.", "Öffne den zweiten Fall. Erkläre, warum Verteilen Verluste nicht völlig verhindert.", "Schreibe einen Merksatz mit „verteilen“ und „Risiko“."], "tip": "Im ersten Fall verliert Pixelwerk die Hälfte. Die übrigen Unternehmen bleiben unverändert. Satzanfang: „Bei A bleiben …, bei B …, weil …“", "sample": "Im ersten Fall bleiben bei A 50 Euro und bei B 87,50 Euro. Nur ein Viertel von B ist vom Einbruch betroffen. Verlieren dagegen alle Unternehmen 20 Prozent, bleiben bei beiden 80 Euro. Verteilen verringert einzelne Risiken, beseitigt aber nicht alle Risiken."}, {"title": "Wenn Geld weniger kaufen kann", "lead": "Inflation bedeutet: Die Preise steigen insgesamt. Mit demselben Geld kannst du dann weniger kaufen. Nicht jeder einzelne Preis muss steigen.", "body": "<p>Ein einzelner teurerer Snack beweist noch keine Inflation. Dafür betrachtet man viele Waren und Dienstleistungen zusammen.</p><div class=\"experiment\"><p>Unser vereinfachtes Beispiel: Du hast 20 Euro. Eine Portion kostet anfangs 2 Euro.</p><label for=\"snack\">Preis einer Portion in Euro</label><input id=\"snack\" type=\"range\" min=\"2\" max=\"5\" value=\"2\" step=\"0.5\"><output id=\"snackout\"></output><div id=\"basket\" class=\"bigresult\" aria-live=\"polite\"></div></div><p>Die Zahl auf deinem Geldschein bleibt gleich. Seine <b>Kaufkraft</b> kann sinken: Das ist die Menge, die du damit kaufen kannst. Aktien schützen nicht automatisch vor Inflation.</p>", "tasks": ["Probiere 2 Euro, 2,50 Euro und 4 Euro aus. Notiere, wie viele ganze Portionen du jeweils kaufen kannst.", "Erkläre den Unterschied: „Ich habe weniger Euro“ und „Ich kann mit meinen Euro weniger kaufen“."], "tip": "20 geteilt durch den Preis ergibt die Anzahl. Satzanfang: „Mein Geldbetrag bleibt …, aber …“", "sample": "Für 20 Euro bekommst du 10, 8 oder 5 Portionen. Der Geldbetrag bleibt 20 Euro. Bei höheren Preisen sinkt die Kaufkraft. Das Beispiel zeigt eine Preisänderung; Inflation bezeichnet einen allgemeinen Preisanstieg."}, {"title": "Was kann regelmäßiges Sparen bewirken?", "lead": "Ein Sparplan bedeutet: regelmäßig einen Betrag zurücklegen oder anlegen. Du entscheidest hier nur mit erfundenen Zahlen.", "body": "<p>Für das Alter vorsorgen heißt, sich auf die Zeit nach dem Arbeitsleben vorzubereiten. Die gesetzliche Rente kann durch betriebliche und private Vorsorge ergänzt werden. Was möglich ist, hängt auch vom verfügbaren Einkommen ab.</p><label for=\"monthly\">Monatlicher Betrag in Euro</label><input id=\"monthly\" type=\"range\" min=\"10\" max=\"100\" value=\"20\" step=\"10\"><output id=\"monthlyout\"></output><label for=\"years\">Jahre</label><input id=\"years\" type=\"range\" min=\"1\" max=\"40\" value=\"10\" step=\"1\"><output id=\"yearsout\"></output><label for=\"rate\">Angenommene jährliche Wertänderung</label><select id=\"rate\"><option value=\"0\">0 %: keine Wertänderung</option><option value=\"3\">+3 %: erfundener günstiger Verlauf</option><option value=\"-3\">−3 %: erfundener ungünstiger Verlauf</option></select><div id=\"savings\" class=\"bigresult\" aria-live=\"polite\"></div><p class=\"small\">Rechenmodell: Einzahlung am Monatsende; gleichmäßige monatliche Änderung aus dem Jahreswert. Echte Kurse schwanken. Ohne Gebühren, Steuern und Inflation. Keine Vorhersage und keine zugesicherte Rendite.</p>", "tasks": ["Stelle 20 Euro und 10 Jahre ein. Vergleiche die drei Verläufe. Notiere Einzahlung und Ergebnis.", "Ändere nur die Jahre auf 30. Beschreibe, was dir auffällt.", "Erkläre, weshalb auch langes Anlegen keine Garantie für Gewinn ist."], "tip": "Bei 0 % zählt nur dein eigenes Geld: Monatsbetrag × 12 × Jahre. Satzanfang: „Der Rechner zeigt Möglichkeiten, aber …“", "sample": "Bei 20 Euro über 10 Jahre zahlst du 2.400 Euro ein; über 30 Jahre 7.200 Euro. Ein günstiger Verlauf kann den Betrag erhöhen, ein ungünstiger senken. Echte zukünftige Wertänderungen kennt niemand."}, {"title": "Welche Anlage passt zum Ziel?", "lead": "Bevor jemand Geld anlegt, sollte klar sein: Wann wird es gebraucht? Wie viel Verlust wäre verkraftbar?", "body": "<div class=\"cases\"><article><h3>Alex, 18</h3><p>Alex hat 600 Euro für den Führerschein gespart. In drei Monaten muss die Rechnung bezahlt werden. Das Geld wird vollständig gebraucht.</p></article><article><h3>Samira, 18</h3><p>Samira spart für das Alter. Eine Notfallreserve liegt bereits auf einem erreichbaren Konto. Einen kleinen übrigen Betrag könnte sie lange anlegen. Kursschwankungen wären für sie aushaltbar.</p></article></div><p><b>Buch S. 204, M6:</b> Schau dir das Dreieck der Geldanlage an. Suche die drei Ziele. Die Wortkarten helfen dir beim Verstehen.</p><div class=\"experiment\"><button onclick=\"criterion(0)\">Sicherheit</button> <button onclick=\"criterion(1)\">Verfügbarkeit</button> <button onclick=\"criterion(2)\">Rentabilität</button><p id=\"criterion\" aria-live=\"polite\">Tippe auf ein Ziel.</p></div><p>Falls du gerade kein Buch hast, nutze die drei Wortkarten. Sie erklären die nötigen Begriffe.</p>", "tasks": ["Nenne für Alex das wichtigste Ziel aus dem Dreieck. Begründe mit einem Detail aus dem Fall.", "Beurteile: Passt eine einzelne Aktie zu Alex? Könnte ein breit verteilter Aktienfonds für Samira infrage kommen? Nenne bei Samira auch ein Risiko.", "Formuliere deine eigene Regel: „Geld, das ich bald unbedingt brauche, …“"], "tip": "Sicherheit: möglichst kein Verlust. Verfügbarkeit: Geld rechtzeitig nutzen können. Rentabilität: Verhältnis von Ertrag zu eingesetztem Geld. Satzanfang: „Für Alex ist … wichtig, weil …“", "sample": "Für Alex stehen Sicherheit und rechtzeitige Verfügbarkeit im Vordergrund. Eine einzelne Aktie kann bis zur Rechnung stark fallen. Für Samiras langfristiges Ziel kann ein breit verteilter Aktienfonds infrage kommen. Auch damit sind Verluste möglich; ihre Reserve sollte davon getrennt bleiben."}, {"title": "Apps und schnelle Versprechen", "lead": "Eine einfach bedienbare App macht eine Geldanlage nicht automatisch einfach oder sicher.", "body": "<p><b>Broker</b> heißt: ein Anbieter, der Kauf und Verkauf von Wertpapieren ermöglicht. Trade Republic ist ein Beispiel, keine Empfehlung. Ein <b>Depot</b> ist das Konto, auf dem Wertpapiere verwahrt und angezeigt werden.</p><p>Mit 16 bist du noch nicht volljährig. Verträge mit rechtlichen Verpflichtungen benötigen grundsätzlich die Zustimmung deiner gesetzlichen Vertretung. Anbieter haben außerdem eigene Alters- und Produktbedingungen. Eine App ist keine Erlaubnis, allein zu handeln.</p><p><b>Knock-out-Produkte sind keine normalen Aktien.</b> Sie verstärken Kursbewegungen. Wird eine bestimmte Grenze erreicht, wird das Produkt beendet; der Einsatz kann vollständig verloren gehen. Auch ein späterer Kursanstieg macht das nicht rückgängig.</p><div class=\"experiment\"><p>Erfundenes Beispiel: Die kritische Grenze liegt bei 90. Beobachte die Reihenfolge.</p><button id=\"koNext\" onclick=\"ko()\">Nächsten Schritt zeigen</button> <button onclick=\"koReset()\">Von vorn ansehen</button><div id=\"ko\" aria-live=\"polite\"></div></div><p>Hier wird nichts gekauft. Niemand muss ein Konto eröffnen oder eine App installieren.</p>", "tasks": ["Erkläre, warum ein grüner Kaufknopf nichts über das Risiko aussagt.", "Klicke die Knock-out-Folge bis zum Ende durch. Erkläre, warum der spätere Anstieg den Verlust nicht aufhebt.", "Schreibe zwei Rückfragen an jemanden, der „schnellen sicheren Gewinn“ verspricht."], "tip": "Frage nach möglichen Verlusten und danach, wer an einem Kauf verdient. Satzanfang: „Die Grenze wurde bereits …“", "sample": "Die Bedienung sagt nichts über die Sicherheit aus. Im Modell wird die Grenze erreicht und das Produkt beendet. Die spätere Erholung hilft nicht mehr. Sinnvolle Fragen: Kann ich alles verlieren? Welche Kosten entstehen? Wer verdient an meiner Entscheidung?"}, {"title": "Was kannst du jetzt erklären?", "lead": "Nutze den Wissenscheck erst, wenn deine Lehrkraft ihn freigibt. Bis dahin kannst du Antworten ergänzen oder die Vertiefung bearbeiten.", "body": "<p>Die Freigabe erfolgt frühestens nach 30 Minuten eigener Arbeit in einer Einzelstunde beziehungsweise 45 Minuten in einer Doppelstunde. Einführung und Pausen zählen nicht mit.</p><div id=\"quiz\"></div>", "tasks": ["Kehre zu deiner ersten Vermutung zurück. Schreibe: „Am Anfang dachte ich … Jetzt weiß ich …“", "Beantworte die Leitfrage „Wie funktionieren Aktien?“ in vier kurzen Sätzen. Nutze Anteil, Kurs, Risiko und Vorsorge."], "tip": "Satzgerüst: „Eine Aktie ist … Ihr Kurs … Ein Risiko ist … Bei der Vorsorge sollte man …“", "sample": "Deine Erklärung sollte zeigen: Aktie = Unternehmensanteil; Kurse können steigen und fallen; Verluste sind möglich; zum Anlageziel müssen Zeit, Risiko und Verteilung passen."}, {"title": "Weiterdenken und selbst gestalten", "lead": "Wähle eine Aufgabe. Wenn du fertig bist, bearbeite eine weitere oder entwickle einen neuen Fall.", "body": "<h3>Eine Nachricht verbessern</h3><blockquote>„Mit meiner Lieblingsaktie verdopple ich garantiert mein Geld. Ein ETF kann sowieso nicht fallen.“</blockquote><p>Schreibe den Beitrag sachlich um. Nutze höchstens fünf Sätze und erkläre zwei Fehler.</p><h3>Ein Erklärstück schreiben</h3><p>Schreibe einen kurzen Dialog: Eine Person verwechselt ein Spiel mit einer Aktie. Die andere erklärt den Unterschied an einem eigenen Beispiel. Lass beide auch über ein Risiko sprechen.</p><h3>Ein eigener Fall</h3><p>Erfinde eine Person mit einem Sparziel. Lege fest, wann sie das Geld braucht und ob sie einen Verlust verkraften könnte. Gib den Fall einer anderen Person. Prüfe ihre Begründung mit Sicherheit, Verfügbarkeit und Rentabilität. Allein: Schreibe zwei verschiedene Empfehlungen und entscheide begründet.</p><h3>Mit dem Buch vertiefen</h3><p><b>Buch S. 206, M9:</b> Lies den Abschnitt zu ETFs. Notiere zwei Möglichkeiten, Geld zu verteilen. Vergleiche sie mit Station 6. Ohne Buch: Erfinde einen Korb aus vier verschiedenen Unternehmensbereichen. Erkläre, warum vier Spielefirmen weniger breit verteilt wären.</p>", "tasks": ["Halte dein gewähltes Produkt hier fest. Überschreibe es nicht, wenn du eine weitere Aufgabe bearbeitest: Schreibe darunter weiter."], "tip": "Für den Dialog: „Wenn ich das Spiel kaufe, … Wenn ich eine Aktie kaufe, …“ Für den Fall: Ziel – Zeit – mögliches Risiko – begründete Entscheidung.", "sample": "Prüfe dein Produkt: Sind die Begriffe richtig? Wird kein sicherer Gewinn versprochen? Passt die Empfehlung zur Person? Du kannst weitere Fälle oder eigene Fragen mit begründeten Antworten erstellen."}];
const KEY='aktien-start-lernweg-1';let state={answers:{},done:{},values:{},quiz:{},logs:[]},storageOK=true,current=0;
try{let raw=localStorage.getItem(KEY);if(raw){let x=JSON.parse(raw);if(x&&x.answers&&x.done&&x.values&&x.quiz&&Array.isArray(x.logs))state=x;}}catch(e){storageOK=false}
const $=id=>document.getElementById(id),money=x=>x.toLocaleString('de-DE',{style:'currency',currency:'EUR'}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}if($('status'))$('status').textContent=storageOK?'Auf diesem Gerät gespeichert.':'Speichern hier nicht möglich. Sichere deine Ergebnisse über „Ergebnisse“. Das Schließen der Seite kann sie löschen.'}
function foot(){return `<footer><details><summary>Wörter nachschlagen</summary>${[['Aktie','Anteil an einem Unternehmen.'],['Kurs','Preis, zu dem eine Aktie gehandelt wird.'],['Gewinn','Was nach Abzug der Kosten übrig bleibt; beim Verkauf einer Aktie zählt der Unterschied zum Kaufpreis, abzüglich Kosten.'],['Dividende','Eine mögliche Auszahlung des Unternehmens an Aktionäre.'],['Inflation','Allgemeiner Anstieg der Preise. Geld verliert dadurch Kaufkraft.'],['ETF','Ein an der Börse gehandelter Fonds; viele bilden eine Gruppe von Wertpapieren nach.'],['Rendite','Gewinn oder Verlust im Verhältnis zum eingesetzten Geld.'],['Depot','Konto zur Verwahrung und Anzeige von Wertpapieren.']].map(([a,b])=>`<p><b>${a}:</b> ${b}</p>`).join('')}</details><details><summary>Quellen und Daten</summary><p>Erklärungen und Rechenmodelle zur finanziellen Bildung. Keine Anlageberatung. Alle Modellbeträge und Pixelwerk sind erfunden. Reale Unternehmen dienen als Beispiele, nicht als Empfehlung.</p><p><a href="https://bafin.de/DE/Verbraucher/GeldanlageWertpapiere/Grundregeln_der_Geldanlage/Grundregeln_der_Geldanlage_node.html" target="_blank" rel="noopener noreferrer">BaFin: Grundlagen der Geldanlage</a> · <a href="https://www.ecb.europa.eu/ecb-and-you/explainers/tell-me-more/html/what_is_inflation.de.html" target="_blank" rel="noopener noreferrer">EZB: Inflation</a> · <a href="https://www.take2games.com/ir" target="_blank" rel="noopener noreferrer">Take-Two: Unternehmensprofil</a> · <a href="https://www.gesetze-im-internet.de/bgb/__107.html" target="_blank" rel="noopener noreferrer">§ 107 BGB</a></p><p>Deine Antworten bleiben in diesem Browser. Die Seite versendet sie nicht. Auf gemeinsam genutzten Geräten nach dem Sichern löschen. Geräte- oder Browserwechsel übernehmen die Daten nicht. Der Hostinganbieter kann Verbindungsdaten wie IP-Adressen verarbeiten.</p></details></footer>`}
$('route').innerHTML=stations.map((s,i)=>`<option value="${i}">${i===0?'Start':i+'.'} ${s.title}</option>`).join('');$('route').onchange=e=>go(+e.target.value);
function checkPoint(n){return `<aside class="check"><h3>Kurz zeigen ${n}</h3><p>${n===1?'Bereite deine Antwort aus Station 6 vor: Vergleiche 50 Euro mit 87,50 Euro und erkläre kurz den Grund. Bei Partnerarbeit berichtet Person A.':'Bereite dein Urteil zu Alex aus Station 9 vor. Nenne ein Ziel aus dem Dreieck und einen Grund. Bei Partnerarbeit berichtet Person B.'} Allein übernimmst du den Bericht selbst.</p><p>Die Lehrkraft öffnet das Gesprächsfenster frühestens nach 30 Minuten eigener Arbeit in einer Einzelstunde oder 45 Minuten in einer Doppelstunde. Warte auf diese Freigabe. Zeige dann leise per Handzeichen, dass du bereit bist.</p><p>Bleib sitzen und arbeite ${n===1?'an Station 7':'am Wissenscheck nach Freigabe oder an der Vertiefung'} weiter. Erst beim einzelnen Aufruf gehst du zur Lehrkraft. Erkläre nur diesen Ausschnitt in etwa 20–30 Sekunden.</p></aside>`}
function go(i){current=Math.max(0,Math.min(stations.length-1,i));let s=stations[current];$('route').value=current;$('main').innerHTML=`<div class="eyebrow">${current===0?'Dein Einstieg':current===12?'Vertiefung':'Station '+current}</div><h1 tabindex="-1">${s.title}</h1><p class="lead">${s.lead}</p><div class="body">${s.body}</div><div class="tasks"><h2>Dein nächster Schritt</h2><ol>${s.tasks.map(t=>'<li>'+t+'</li>').join('')}</ol><label for="answer">Deine Antwort</label><textarea id="answer" placeholder="Schreibe hier oder nutze dein Heft.">${esc(state.answers[current]||'')}</textarea><p id="status"></p><details><summary>Denkhilfe</summary><p>${s.tip}</p></details><details><summary>Nach deiner Antwort vergleichen</summary><p>${s.sample}</p><p>Vergleiche mit deiner Antwort und verbessere sie bei Bedarf.</p></details></div>${current===6?checkPoint(1):current===9?checkPoint(2):''}<label class="done"><input type="checkbox" id="done" ${state.done[current]?'checked':''}>Ich habe die Aufgaben bearbeitet und kann meinen Gedanken erklären.</label>${foot()}`;$('answer').oninput=e=>{state.answers[current]=e.target.value;save()};$('done').onchange=e=>{state.done[current]=e.target.checked;save();position()};$('prev').disabled=current===0;$('next').disabled=current===stations.length-1;position();init();save();window.scrollTo(0,0);$('main').querySelector('h1').focus({preventScroll:true})}

function bind(id,fn){if(!$(id))return;if(state.values[id]!==undefined)$(id).value=state.values[id];$(id).oninput=()=>{state.values[id]=$(id).value;fn();save()};fn()}
function init(){bind('shares',()=>{let n=+$('shares').value;$('sharesout').textContent=`${n} von 100 Anteilen = ${n} Prozent`;$('squares').innerHTML=Array.from({length:100},(_,i)=>`<span class="square ${i<n?'mine':''}"></span>`).join('')});bind('price',()=>{let p=+$('price').value,v=p*10;$('priceout').textContent=money(p);$('priceResult').innerHTML=`10 Aktien × ${money(p)} = <strong>${money(v)}</strong><br>Gegenüber 100 Euro: ${v>=100?'+':''}${money(v-100)}`;$('pricebar').style.width=v/2+'%'});bind('cost',()=>{let c=+$('cost').value;$('costout').textContent=money(c);$('profit').textContent=`100 Euro Einnahmen − ${c} Euro Kosten = ${Math.abs(100-c)} Euro ${c>100?'Verlust':'Gewinn'}`});bind('snack',()=>{let p=+$('snack').value,n=Math.floor(20/p);$('snackout').textContent=money(p);$('basket').textContent=`20 Euro reichen für ${n} ganze Portionen. Übrig bleiben ${money(20-n*p)}.`});['monthly','years','rate'].forEach(x=>bind(x,savings));if($('flow'))flow(0);if($('risk'))risk(0);if($('ko'))koReset();if($('quiz'))renderQuiz()}
function savings(){if(!$('monthly'))return;let m=+$('monthly').value,y=+$('years').value,r=Math.pow(1+(+$('rate').value)/100,1/12)-1,v=0;for(let i=0;i<y*12;i++)v=v*(1+r)+m;$('monthlyout').textContent=money(m);$('yearsout').textContent=y+' Jahre';$('savings').innerHTML=`Selbst eingezahlt: <strong>${money(m*12*y)}</strong><br>Ergebnis im gewählten Modell: <strong>${money(v)}</strong>`}
function flow(n){$('flow').innerHTML=n===0?'<b>Neue Aktien:</b><p>Anleger bezahlt das Unternehmen.<br>Das Unternehmen gibt ihm neue Aktien.</p>':'<b>Weiterverkauf:</b><p>Käufer bezahlt den bisherigen Eigentümer.<br>Der bisherige Eigentümer überträgt die Aktie.</p>';state.values.flow=n;save()}
function news(n){$('news').textContent=['Viele Vorbestellungen können höhere Einnahmen erwarten lassen. Aber die Herstellung kostet ebenfalls Geld. Ein Erfolg kann schon erwartet worden sein.','Teurere Entwicklung kann den Gewinn verkleinern. Anleger könnten deshalb weniger für die Aktie zahlen wollen.','Ein starkes Konkurrenzprodukt könnte Kunden abwerben. Ob das tatsächlich passiert, ist noch offen.'][n];state.values.news=n;save()}
function risk(n){$('risk').innerHTML=n===0?'<h3>Nur Pixelwerk verliert 50 %</h3><p>A: 100 Euro in Pixelwerk werden zu <b>50 Euro</b>.</p><p>B: 25 Euro Pixelwerk werden zu 12,50 Euro. Die anderen 75 Euro bleiben gleich. Zusammen: <b>87,50 Euro</b>.</p>':'<h3>Alle Unternehmen verlieren 20 %</h3><p>A: 100 Euro werden zu <b>80 Euro</b>.</p><p>B: Viermal 25 Euro werden zu viermal 20 Euro. Zusammen: <b>80 Euro</b>.</p>';state.values.risk=n;save()}
