<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erfindungen, die den Alltag veränderten · GL 8</title>
<!-- Bildnachweise (Unsplash-Lizenz, keine Namensnennung nötig): Telegraf Reza Amiri; Telefonhörer Alexander Andrews; Glühlampen Patrick Tomasso; Kamera Vitalii Kyktov; Hochrad Haut Risque; Motorwagen Dawid Tkocz; Nähmaschine Angela Bailey; Jacquard-Webstuhl Georg Eiermann -->
<style>
:root{
  --paper:#f5f2ea; --card:#fffdf8; --ink:#1d2430; --ink2:#46505e; --line:#d9d2c3;
  --pet:#0e5a63; --pet-d:#0a434a; --pet-l:#e1eeef;
  --brass:#b8862b; --brass-l:#f6ecd6;
  --ok:#2c6b3c; --ok-l:#e2f0e5; --no:#9c3426; --no-l:#f7e3df;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5}
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:18px 18px 60px}
header.top{border-bottom:3px double var(--ink);padding:6px 0 12px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pet);font-weight:700}
.top h1{font-family:var(--serif);font-weight:normal;font-size:1.75rem;margin:2px 0 0;line-height:1.2}
.prog{min-width:200px;flex:1;max-width:300px}
.prog .bar{height:8px;background:#e6dfcf;border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--pet);width:0;transition:width .4s}
.prog .lbl{font-size:.78rem;color:var(--ink2);margin-top:4px;text-align:right}
h2{font-family:var(--serif);font-weight:normal;font-size:1.45rem;margin:.2em 0 .5em;color:var(--pet-d)}
.room{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-top:4px}
p{margin:.55em 0}
.intro{background:var(--card);border-left:5px solid var(--pet);padding:14px 16px;margin:10px 0 18px}
.exhibit{background:var(--card);border:1px solid var(--line);margin:14px 0 22px}
.exhibit figure{margin:0;position:relative;background:#222}
.exhibit img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover}
.exhibit figcaption{font-size:.75rem;color:#e9e4d8;background:rgba(20,22,26,.72);position:absolute;right:0;bottom:0;padding:3px 8px}
.label{display:flex;gap:14px;align-items:baseline;padding:12px 16px 0;border-top:4px solid var(--brass)}
.label .no{font-family:var(--serif);font-size:1.6rem;color:var(--brass);line-height:1}
.label .ttl{font-weight:700;font-size:1.08rem}
.label .yr{margin-left:auto;font-family:var(--serif);font-size:1.1rem;color:var(--pet-d);white-space:nowrap}
.exhibit .txt{padding:4px 16px 4px}
.word{border-bottom:1px dotted var(--pet);cursor:help}
.gloss{font-size:.85rem;color:var(--ink2);padding:0 16px 8px}
.q{border-top:1px solid var(--line);padding:12px 16px 16px;background:#fbf8f1}
.q .qh{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pet);font-weight:700;margin-bottom:4px}
.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:grid;gap:8px}
button{font:inherit;color:inherit}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);padding:11px 14px;min-height:48px;border-radius:4px;cursor:pointer}
.opt:hover{border-color:var(--pet)}
.opt.ok{background:var(--ok-l);border-color:var(--ok)}
.opt.no{background:var(--no-l);border-color:var(--no);text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-left:4px solid var(--ok);background:var(--ok-l);display:none}
.fb.bad{border-left-color:var(--no);background:var(--no-l)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.btn{background:var(--pet);color:#fff;border:0;padding:12px 22px;min-height:48px;font-weight:700;border-radius:4px;cursor:pointer}
.btn:disabled{background:#9fb5b8;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pet);border:2px solid var(--pet)}
.hint{font-size:.85rem;color:var(--ink2)}
/* Zuordnen */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.chip{background:#fff;border:2px solid var(--line);padding:10px 12px;min-height:52px;border-radius:4px;text-align:left;cursor:pointer}
.chip.sel{border-color:var(--brass);background:var(--brass-l)}
.chip.done{border-color:var(--ok);background:var(--ok-l);cursor:default}
.chip.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.portrait{background:var(--card);border:1px solid var(--line);padding:12px 16px;margin:10px 0}
.portrait h3{margin:0 0 4px;font-family:var(--serif);font-weight:normal;font-size:1.15rem;color:var(--pet-d)}
/* Zeitstrahl */
.pool,.line{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:4px;background:#fff}
.line{border-style:solid;border-color:var(--pet);background:var(--pet-l);counter-reset:n}
.tile{background:#fff;border:2px solid var(--ink2);padding:8px 12px;min-height:44px;border-radius:4px;cursor:pointer}
.line .tile{counter-increment:n}
.line .tile::before{content:counter(n) ". ";font-weight:700;color:var(--pet)}
.tile.okc{border-color:var(--ok);background:var(--ok-l)}
.tile.noc{border-color:var(--no);background:var(--no-l)}
/* Heft */
.heft{background:var(--card);border:1px solid var(--line);padding:14px 16px;background-image:repeating-linear-gradient(transparent 0 31px,#e7e0cf 31px 32px)}
details{margin-top:12px;background:#fff;border:1px solid var(--line);padding:10px 14px}
summary{cursor:pointer;font-weight:700;color:var(--pet)}
/* Ergebnis */
.result{background:var(--card);border:2px solid var(--ink);padding:18px}
.stufe{display:flex;align-items:center;gap:16px;margin:10px 0}
.stufe .badge{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:2.6rem;border:3px solid var(--ink)}
.stufe .badge.A{border-radius:50%}
.stufe .badge.B{border-radius:0}
.stufe .badge.C{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;background:var(--brass-l);padding-top:18px}
.stufe .badge.D{transform:rotate(45deg);width:64px;height:64px;margin:12px 18px 12px 12px;font-size:2.2rem}
.stufe .badge.D span{transform:rotate(-45deg)}
table.etap{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem}
table.etap td{border-bottom:1px solid var(--line);padding:6px 4px}
.morse{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;letter-spacing:.15em;background:#fff;border:1px solid var(--line);padding:10px 12px;display:inline-block}
.mtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;margin:8px 0}
.mtab span{background:#fff;border:1px solid var(--line);padding:4px 6px}
input[type=text]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:4px;min-height:48px;width:220px;text-transform:uppercase}
.confirm{display:none;background:var(--brass-l);border:1px solid var(--brass);padding:10px 12px;margin-top:10px}
.small{font-size:.82rem;color:var(--ink2)}
@media (max-width:620px){.match{grid-template-columns:1fr}.top h1{font-size:1.45rem}html,body{font-size:17px}}
</style>
</head>

  <div>

  </div>
  <div class="prog"><div class="bar"><i id="pbar"></i></div><div class="lbl" id="plbl"></div></div>
</header>
<main id="app"></main>
</div>

 {id:"e1",room:"Raum 1 · Nachrichten",no:1,t:"Der elektrische Telegraf",yr:"1844",img:"telegraf",cap:"Telegrafen-Geräte, Museum",
  txt:"<p>Bis um 1840 war eine Nachricht nur so schnell wie ein Reiter oder eine Postkutsche. Ein Brief von Berlin nach Köln war mehrere Tage unterwegs. Der elektrische Telegraf änderte das: Über einen Draht wurden kurze und lange Stromstöße geschickt.</p><p>Der Amerikaner Samuel Morse entwickelte dafür ein Alphabet aus kurzen und langen Zeichen, das <span class='word'>Morsealphabet</span>. 1844 ging in den USA eine Telegrafenleitung zwischen Washington und Baltimore in Betrieb. Bald zogen sich Leitungen entlang der Eisenbahnstrecken durch ganz Europa. Ab 1866 verband ein Kabel durch den Atlantik Europa und Amerika dauerhaft.</p>",
  q:"Ein Kaufmann in Hamburg will 1870 wissen, was Baumwolle in New York kostet. Was ist für ihn der größte Vorteil des Telegrafen?",
  o:["Er erfährt den Preis am selben Tag und kann schneller kaufen oder verkaufen als seine Konkurrenz.","Er kann die Baumwolle über den Draht schicken lassen.","Er kann mit dem Händler sprechen und dessen Stimme hören.","Er muss für die Baumwolle nichts mehr bezahlen."],a:0,
  ex:"Der Telegraf übertrug Nachrichten in Minuten statt in Wochen. Wer Preise zuerst kannte, konnte besser handeln. Die Stimme übertrug erst das Telefon."},
 {id:"e2",room:"Raum 1 · Nachrichten",no:2,t:"Das Telefon",yr:"1876",img:"telefon",cap:"Telefonhörer einer späteren Bauart",
  txt:"<p>Beim Telegrafen brauchte man Fachleute, die das Morsealphabet beherrschten. Beim Telefon wird die Stimme selbst übertragen. Schon 1861 führte der Lehrer Philipp Reis in Frankfurt ein Gerät vor, das Töne über einen Draht schickte. Er nannte es „Telephon“. 1876 erhielt Alexander Graham Bell in den USA ein <span class='word'>Patent</span> auf sein Telefon, und es setzte sich durch.</p><p>Um 1900 hatten trotzdem nur wenige ein eigenes Telefon, vor allem Ärzte, Fabrikbesitzer, Händler und Behörden. Jedes Gespräch lief über das „Fräulein vom Amt“: Eine Telefonistin verband die Leitungen von Hand.</p>",
  gl:"Patent: Urkunde vom Staat. Nur wer sie hat, darf eine Erfindung eine bestimmte Zeit lang bauen und verkaufen.",
  q:"Warum hatten um 1900 vor allem Ärzte, Händler und Fabrikbesitzer ein Telefon?",
  o:["Telefone waren für Arbeiterinnen und Arbeiter verboten.","Sie mussten schnell erreichbar sein und konnten sich Gerät und Anschluss leisten.","Telefone funktionierten nur in Fabriken und Praxen.","Ärzte hatten das Telefon erfunden."],a:1,
  ex:"Ein Anschluss war teuer. Wer beruflich schnell erreichbar sein musste und Geld hatte, schaffte sich zuerst einen an."},
 {id:"e3",room:"Raum 2 · Licht und Bild",no:3,t:"Die Glühlampe",yr:"1879",img:"licht",cap:"Glühlampen mit Kohlefaden-Optik",
  txt:"<p>Lange richtete sich die Arbeit nach dem Tageslicht. Abends gab es Kerzen, Öllampen oder Gaslicht. Gaslicht rußte und konnte Brände auslösen. 1879 stellte Thomas Edison in den USA eine Glühlampe vor, die viele Stunden leuchtete. In ihr glüht ein dünner Faden, durch den Strom fließt.</p><p>Damit Lampen überall brennen konnten, brauchte man aber Strom. 1882 eröffnete Edison in New York eines der ersten Kraftwerke. In Deutschland baute Werner von Siemens Generatoren und zeigte 1879 in Berlin die erste elektrische Bahn. Elektrisches Licht machte Straßen, Wohnungen und Fabrikhallen auch nachts hell.</p>",
  q:"Eine Spinnerei bekommt 1895 elektrisches Licht. Welche Folge hat das sehr wahrscheinlich für die Arbeiterinnen und Arbeiter?",
  o:["Die Arbeitszeit wird automatisch kürzer.","Die Maschinen brauchen keine Menschen mehr.","Die Fabrik kann auch nachts laufen, Nachtschichten werden häufiger.","Es gibt keine Unfälle mehr."],a:2,
  ex:"Denk an die letzte Stunde zur Arbeit in der Fabrik: Helles Licht bedeutete nicht weniger Arbeit, sondern oft Schichtbetrieb rund um die Uhr."},
 {id:"e4",room:"Raum 2 · Licht und Bild",no:4,t:"Die Fotografie",yr:"1839",img:"kamera",cap:"Alte Balgenkamera im Museum",
  txt:"<p>Vor 1839 konnte man ein Bild nur malen oder zeichnen. Ein gemaltes Porträt konnten sich meist nur reiche Leute leisten. 1839 stellte Louis Daguerre in Paris ein Verfahren vor, mit dem Licht ein Bild auf einer Platte festhielt. Anfangs musste man dafür mehrere Minuten völlig still sitzen. Auch deshalb schauen Menschen auf sehr alten Fotos oft ernst.</p><p>Bald wurden die Geräte schneller und billiger. Fotos zeigten nun, wie es in Fabriken, Bergwerken und Arbeitervierteln aussah. Viele Bilder in deinem GL-Buch gibt es nur dank dieser Erfindung.</p>",
  q:"Warum sind Fotos aus der Zeit der Industrialisierung für Historikerinnen und Historiker so wertvoll?",
  o:["Sie zeigen, wie Orte und Menschen damals aussahen. Man muss aber prüfen, ob ein Foto gestellt ist.","Auf alten Fotos wurde nie etwas gestellt, sie zeigen immer die ganze Wahrheit.","Sie zeigen alle Farben ganz genau.","Sie sind älter als alle Gemälde."],a:0,
  ex:"Fotos sind wichtige Quellen. Aber auch Fotografen wählten Ausschnitte und ließen Menschen posieren. Darum fragt man immer: Wer hat das Foto gemacht und wozu?"},
 {id:"e5",room:"Raum 3 · Unterwegs",no:5,t:"Vom Laufrad zum Fahrrad",yr:"1817–1888",img:"hochrad",cap:"Hochrad, um 1880",
  txt:"<p>1817 fuhr Karl Drais in Mannheim mit seiner Laufmaschine. Sie hatte keine Pedale: Man stieß sich mit den Füßen vom Boden ab. Um 1870 kam das Hochrad auf. Die Pedale saßen direkt am riesigen Vorderrad. Je größer das Rad, desto schneller war man, aber der Fahrer saß hoch oben und Stürze waren gefährlich.</p><p>Ab etwa 1885 setzte sich das niedrige Rad mit Kette durch, ab 1888 kamen Luftreifen dazu. Das Fahrrad wurde günstig genug für Arbeiterfamilien. Viele fuhren damit zur Fabrik und konnten weiter weg wohnen, wo die Mieten niedriger waren. Auch für viele Frauen bedeutete das Rad ein Stück Freiheit.</p>",
  q:"Warum wurde das Fahrrad gerade für Arbeiterfamilien so wichtig?",
  o:["Fahrräder waren in Fabriken Pflicht.","Arbeiter durften nicht mit der Bahn fahren.","Mit dem Hochrad konnte man schwere Waren transportieren.","Man kam ohne teure Fahrkarte oder Kutsche schnell zur Arbeit und konnte günstiger am Stadtrand wohnen."],a:3,
  ex:"Das Rad kostete nach dem Kauf fast nichts. Der Arbeitsweg wurde kürzer, und man war nicht mehr gezwungen, direkt neben der Fabrik zu wohnen."},
 {id:"e6",room:"Raum 3 · Unterwegs",no:6,t:"Der Motorwagen und Bertha Benz",yr:"1886 / 1888",img:"motor",cap:"Etwas späterer Motorwagen mit vier Rädern, Museum",
  txt:"<p>1886 meldete Carl Benz in Mannheim sein „Fahrzeug mit Gasmotorenbetrieb“ zum Patent an, den Benz Patent-Motorwagen. Er hatte drei Räder und einen Benzinmotor. Kaum jemand traute dem lauten Gefährt.</p><p>Im August 1888 fuhr Bertha Benz, Carls Frau, mit ihren beiden Söhnen ohne Wissen ihres Mannes von Mannheim nach Pforzheim, rund 100 Kilometer. Tankstellen gab es noch nicht: Treibstoff kaufte sie in einer Apotheke in Wiesloch. Eine verstopfte Leitung reinigte sie der Überlieferung nach mit ihrer Hutnadel. Bertha Benz hatte mit ihrem Geld die Firma mitfinanziert. Ihre Fahrt machte das Auto bekannt.</p>",
  q:"Was bewies die Fahrt von Bertha Benz im Jahr 1888 vor allem?",
  o:["Autos brauchten keinen Treibstoff.","Der Motorwagen taugte auch für lange Strecken und war damit alltagstauglich.","Carl Benz hatte das Auto gar nicht erfunden.","Es gab schon überall Tankstellen."],a:1,
  ex:"Vorher war der Wagen nur kurze Strecken gefahren. Die Fahrt zeigte: Man kann damit wirklich reisen. Das überzeugte Kunden."},
 {id:"e7",room:"Raum 4 · Maschinen im Haus",no:7,t:"Die Nähmaschine",yr:"1851",img:"naeh",cap:"Nähmaschine von Singer",
  txt:"<p>Früher wurde jede Naht von Hand genäht. Für ein Hemd brauchte eine Näherin viele Stunden. Isaac Singer verbesserte die Nähmaschine und erhielt 1851 ein Patent. Seine Firma verkaufte die Maschinen auch auf <span class='word'>Raten</span>. So kamen Nähmaschinen in viele Haushalte.</p><p>Kleidung wurde billiger, denn in Kleiderfabriken nähten nun Frauen an langen Reihen von Maschinen. Viele Frauen nähten auch zu Hause für Firmen, bezahlt nach Stückzahl, oft bis spät in die Nacht. Diese <span class='word'>Heimarbeit</span> war schlecht bezahlt.</p>",
  gl:"Ratenkauf: Man bezahlt nicht alles auf einmal, sondern jeden Monat einen kleinen Betrag. · Heimarbeit: Arbeit für eine Firma in der eigenen Wohnung.",
  q:"Warum war der Ratenkauf für den Erfolg der Nähmaschine so wichtig?",
  o:["Die Maschine wurde dadurch billiger hergestellt.","Nur Fabriken durften auf Raten kaufen.","Auch Familien ohne viel Erspartes konnten die teure Maschine kaufen.","Man musste die Maschine nie bezahlen."],a:2,
  ex:"Eine Nähmaschine kostete viel Geld. Mit kleinen Monatsbeträgen konnten sich auch einfache Familien eine leisten, oft um damit Geld zu verdienen."},
 {id:"e8",room:"Raum 4 · Maschinen im Haus",no:8,t:"Lochkarten: vom Webstuhl zum Programm",yr:"1804 / 1843",img:"jacquard",cap:"Jacquard-Webstuhl mit Lochkarten",
  txt:"<p>Um 1804 baute Joseph-Marie Jacquard in Frankreich einen Webstuhl, der Muster selbst webte. Gesteuert wurde er durch Karten mit Löchern, die <span class='word'>Lochkarten</span>: Wo ein Loch war, wurde ein Faden gehoben, wo keins war, nicht.</p><p>Der Engländer Charles Babbage plante ab den 1830er-Jahren eine Rechenmaschine, die ebenfalls mit Lochkarten arbeiten sollte. Gebaut wurde sie nie. Die Mathematikerin Ada Lovelace beschrieb 1843 Schritt für Schritt, wie diese Maschine eine schwierige Rechnung lösen könnte. Damit schrieb sie eine Art erstes Computerprogramm. Sie verglich: Die Maschine webt Rechnungen, so wie der Webstuhl Blumen und Blätter webt.</p>",
  q:"Was haben ein Jacquard-Webstuhl und ein heutiger Computer gemeinsam?",
  o:["Beide werden mit Dampf angetrieben.","Beide folgen gespeicherten Anweisungen, die nur aus zwei Zuständen bestehen (Loch / kein Loch, 1 / 0).","Beide stellen Stoffe her.","Beide wurden von Ada Lovelace gebaut."],a:1,
  ex:"Loch oder kein Loch entspricht 1 oder 0. Auch Computer arbeiten Programme ab, die aus solchen Ja-Nein-Schritten bestehen."}
];

 {id:"f2",q:"Ein Arbeiter zieht 1895 in eine billigere Wohnung am Stadtrand, sechs Kilometer von der Fabrik entfernt. Welche Erfindung hilft ihm dabei am meisten?",o:["Das Telefon","Die Fotografie","Das Fahrrad mit Kette","Der Jacquard-Webstuhl"],a:2,ex:"Sechs Kilometer zu Fuß dauern über eine Stunde, mit dem Rad etwa 20 Minuten. Ein Telefon hätte er sich ohnehin nicht leisten können."},
 {id:"f3",q:"Welche Technik von heute geht direkt auf die Idee der Lochkarte zurück?",o:["Die LED-Lampe","Das E-Bike","Das Computerprogramm","Die Handykamera"],a:2,ex:"Lochkarten speicherten Befehle. Noch bis in die 1970er-Jahre wurden Computer mit Lochkarten programmiert."},

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function progress(){
  var n=STEPS.length-1, p=Math.min(S.step,n);

/* Multiple Choice */
function mc(container,Q,headline){
  var box=h("<div class='q'><div class='qh'>"+esc(headline||"Frage")+"</div><div class='qt'>"+esc(Q.q)+"</div><div class='opts'></div><div class='fb'></div></div>").firstChild;
  var opts=box.querySelector(".opts"), fb=box.querySelector(".fb");
  Q.o.forEach(function(t,j){
    var b=document.createElement("button");b.className="opt";b.type="button";b.textContent=t;
    b.addEventListener("click",function(){choose(j);});opts.appendChild(b);
  });
  function show(){
    var r=S.ans[Q.id]; if(!r) return;
    var bs=opts.querySelectorAll(".opt");
    r.tried.forEach(function(j){bs[j].classList.add(j===Q.a?"ok":"no");});
    if(r.solved){bs.forEach(function(b){b.disabled=true;});
      fb.className="fb"+(r.first?"":" bad");fb.style.display="block";
      fb.innerHTML="<b>"+(r.first?"Richtig.":"Jetzt stimmt es.")+"</b>"+esc(Q.ex);}
    else{fb.className="fb bad";fb.style.display="block";fb.innerHTML="<b>Noch nicht.</b>Lies den Text noch einmal genau und versuche es erneut.";}
  }
  function choose(j){
    var r=S.ans[Q.id]||(S.ans[Q.id]={tried:[],first:null,solved:false});
    if(r.solved||r.tried.indexOf(j)>=0) return;
    r.tried.push(j);
    if(r.first===null) r.first=(j===Q.a);
    if(j===Q.a) r.solved=true;
    save();show();refreshNav();
  }
  show();container.appendChild(box);
}

var navNext=null;
function refreshNav(){ if(navNext) navNext.disabled=!canGo(); }
function canGo(){
  var st=STEPS[S.step];
  if(st.k==="ex") {var r=S.ans[EX[st.i].id];return !!(r&&r.solved);}
  if(st.k==="women"){var r2=S.ans[WQ.id];return S.match.done.length===WOMEN.length && !!(r2&&r2.solved);}
  if(st.k==="order") return S.order.first!==null && S.order.solved===true;
  if(st.k==="folgen") return FQ.every(function(q){var r=S.ans[q.id];return r&&r.solved;});
  if(st.k==="heft") return S.heft===true;
  return true;
}
function nav(prevOk,nextLabel){
  var n=h("<div class='nav'></div>").firstChild;
  var p=document.createElement("button");p.className="btn ghost";p.type="button";p.textContent="Zurück";
  p.style.visibility=prevOk?"visible":"hidden";
  p.addEventListener("click",function(){S.step=Math.max(0,S.step-1);save();render();});
  var x=document.createElement("button");x.className="btn";x.type="button";x.textContent=nextLabel||"Weiter";
  x.addEventListener("click",function(){if(!canGo())return;S.step=Math.min(STEPS.length-1,S.step+1);if(STEPS[S.step].k==="result"&&!S.doneAt){S.doneAt=new Date().toISOString();}save();render();});
  n.appendChild(p);n.appendChild(x);navNext=x;app.appendChild(n);refreshNav();
}

  app.appendChild(h("<div class='portrait'><h3>Margaret Knight</h3><p>Sie arbeitete schon als Kind in einer Baumwollfabrik in den USA. 1871 erhielt sie ein Patent auf eine Maschine, die Papiertüten mit flachem Boden herstellte. Ein Mann hatte ihre Idee kopiert und behauptete vor Gericht, eine Frau könne so eine Maschine gar nicht erfinden. Mit ihren Zeichnungen bewies sie das Gegenteil und gewann.</p></div><div class='portrait'><h3>Josephine Cochrane und Melitta Bentz</h3><p>Josephine Cochrane erhielt 1886 ein Patent auf eine Geschirrspülmaschine. Melitta Bentz aus Dresden ärgerte sich über Kaffeesatz in der Tasse. Sie probierte es mit Löschpapier aus dem Schulheft ihres Sohnes und meldete 1908 ihren Kaffeefilter an. Die Firma gibt es bis heute.</p></div>"));
  var box=h("<div class='q'><div class='qh'>Zuordnen</div><div class='qt'>Wer hat was erfunden oder geschafft? Tippe links eine Person und dann rechts die passende Leistung an.</div><div class='match'><div class='col' id='mL'></div><div class='col' id='mR'></div></div><div class='fb' id='mfb'></div></div>").firstChild;

  WOMEN.forEach(function(w,i){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=w[0];b.dataset.i=i;L.appendChild(b);
    b.addEventListener("click",function(){if(S.match.done.indexOf(i)>=0)return;L.querySelectorAll(".chip").forEach(function(x){x.classList.remove("sel");});b.classList.add("sel");sel=i;});});
  rorder.forEach(function(i){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=WOMEN[i][1];b.dataset.i=i;R.appendChild(b);
    b.addEventListener("click",function(){if(sel===null||S.match.done.indexOf(i)>=0)return;

        fb.className="fb bad";fb.style.display="block";fb.innerHTML="<b>Passt nicht.</b>Lies oben und in den Exponaten 6 und 8 nach.";}
      refreshNav();});});
  function paint(){
    L.querySelectorAll(".chip").forEach(function(b){var i=+b.dataset.i;b.classList.toggle("done",S.match.done.indexOf(i)>=0);b.classList.remove("sel");});

}
function pHeft(){
  app.appendChild(h("<div class='room'>Ins Heft</div><h2>Deine Rangliste</h2><div class='heft'><p><b>Aufgabe (ins Heft):</b> Welche Erfindungen aus der Ausstellung haben das Leben der Menschen am stärksten verändert?</p><p>1. <b>Wähle</b> drei Erfindungen und bringe sie in eine Rangfolge (Platz 1 bis 3).</p><p>2. <b>Begründe</b> jeden Platz mit einem Satz: „…, weil …“</p><p>3. <b>Nenne</b> zu deinem Platz 1 auch einen Nachteil oder eine Gefahr.</p><p class='small'>Wortspeicher: Kommunikation · Arbeitszeit · Schichtarbeit · Heimarbeit · Mobilität · Fortschritt · Arbeitsweg · Quelle</p></div>"));
  var box=h("<div><button class='btn' type='button' id='wr'>Ich habe meine Rangliste ins Heft geschrieben</button><details id='ml' style='display:none'><summary>Musterlösung ansehen (erst nach dem Schreiben)</summary><p><b>Platz 1: Glühlampe und Strom</b>, weil Fabriken, Straßen und Wohnungen nun auch nachts hell waren und Maschinen mit Strom laufen konnten. Nachteil: Fabriken konnten rund um die Uhr arbeiten, Nachtschichten wurden häufiger.</p><p><b>Platz 2: Telegraf</b>, weil Nachrichten in Minuten statt in Wochen ankamen. Händler, Zeitungen und Regierungen wussten viel schneller Bescheid.</p><p><b>Platz 3: Fahrrad</b>, weil auch Arbeiterfamilien schnell und billig unterwegs sein konnten und nicht mehr direkt neben der Fabrik wohnen mussten.</p><p class='small'>Auch richtig: jede andere Auswahl, wenn du sie mit Folgen für die Menschen begründest. Lochkarte und Nähmaschine sind zum Beispiel ebenfalls sehr gute Wahlen.</p></details></div>").firstChild;
  app.appendChild(box);
  var wr=box.querySelector("#wr"),ml=box.querySelector("#ml");
  function paint(){if(S.heft){wr.disabled=true;wr.textContent="Rangliste geschrieben";ml.style.display="block";}}
  wr.addEventListener("click",function(){S.heft=true;save();paint();refreshNav();});
  paint();
  nav(true,"Zum Ergebnis");
}
function scores(){
  var first=0,after=0;
  var all=EX.concat([WQ]).concat(FQ);
  all.forEach(function(q){var r=S.ans[q.id];if(r&&r.first)first++;var im=S.imp[q.id];if((r&&r.first)||im)after++;});
  var mFirst=WOMEN.length-S.match.firstBad.length; first+=mFirst; after+=WOMEN.length;
  if(S.order.first){first+=2;after+=2;}else if(S.order.solved){after+=2;}
  return {first:first,after:after};
}
function stufe(p){return p>=85?["A","Sicher"]:p>=65?["B","Gut, kleine Lücken"]:p>=40?["C","Teilweise – wiederholen"]:["D","Noch unsicher – noch einmal üben"];}
function pResult(){
  var sc=scores(),pct=Math.round(sc.first/MAX*100),st=stufe(pct);
  var d=S.doneAt?new Date(S.doneAt):new Date();
  var when=d.toLocaleDateString("de-DE")+", "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";
  var rows=[["Exponate 1–8",EX.filter(function(q){var r=S.ans[q.id];return r&&r.first;}).length,EX.length,"Exponate noch einmal ansehen"],
    ["Erfinderinnen",(WOMEN.length-S.match.firstBad.length)+((S.ans.w1&&S.ans.w1.first)?1:0),WOMEN.length+1,"Sonderausstellung noch einmal lesen"],
    ["Zeitleiste",S.order.first?2:0,2,"Jahreszahlen in den Exponaten vergleichen"],
    ["Folgen",FQ.filter(function(q){var r=S.ans[q.id];return r&&r.first;}).length,FQ.length,"Exponate 3, 5, 7 und 8 wiederholen"]];
  var tr=rows.map(function(r){return "<tr><td>"+r[0]+"</td><td><b>"+r[1]+" von "+r[2]+"</b></td><td class='small'>"+(r[1]<r[2]?r[3]:"sicher")+"</td></tr>";}).join("");
  var wrong=EX.concat([WQ]).concat(FQ).filter(function(q){var r=S.ans[q.id];return r&&r.first===false&&!S.imp[q.id];});
  app.appendChild(h("<div class='result'><div class='small'>Erfindungen, die den Alltag veränderten · abgeschlossen am "+esc(when)+"</div><div class='stufe'><div class='badge "+st[0]+"'><span>"+st[0]+"</span></div><div><div style='font-size:1.4rem;font-family:var(--serif)'>Stufe "+st[0]+": "+esc(st[1])+"</div><div>1. Versuch: <b>"+sc.first+" von "+MAX+" Punkten</b> ("+pct+" %)"+(S.improve?" · nach Verbesserung: <b>"+sc.after+" von "+MAX+"</b>":"")+"</div></div></div><table class='etap'>"+tr+"</table><p class='small'>Stufen: A ab 85 % · B 65–84 % · C 40–64 % · D unter 40 %. Es zählt der erste Versuch.</p><p><b>Zeig dieses Ergebnis deiner Lehrkraft, wenn sie danach fragt. Dann geht es weiter mit „Schon fertig?“.</b></p></div>"));
  if(wrong.length){
    var imp=h("<div style='margin-top:16px'><h2>Fehler verbessern</h2><p>Diese Fragen hast du beim ersten Mal falsch beantwortet. Versuche sie noch einmal.</p></div>").firstChild;
    app.appendChild(imp);
    wrong.forEach(function(q){var c=document.createElement("div");c.style.marginBottom="12px";imp.appendChild(c);mcImprove(c,q);});
  }
  nav(true,"Schon fertig? Bonus");
}
function mcImprove(container,Q){
  var box=h("<div class='q'><div class='qh'>Noch einmal</div><div class='qt'>"+esc(Q.q)+"</div><div class='opts'></div><div class='fb'></div></div>").firstChild;
  var opts=box.querySelector(".opts"),fb=box.querySelector(".fb");
  var order=Q.o.map(function(_,j){return j;}).reverse();
  order.forEach(function(j){var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=Q.o[j];
    b.addEventListener("click",function(){S.improve=true;
      if(j===Q.a){S.imp[Q.id]=true;b.classList.add("ok");opts.querySelectorAll(".opt").forEach(function(x){x.disabled=true;});fb.className="fb";fb.style.display="block";fb.innerHTML="<b>Verbessert.</b>"+esc(Q.ex);save();}
      else{b.classList.add("no");b.disabled=true;}});opts.appendChild(b);});
  container.appendChild(box);
}
function pBonus(){
  app.appendChild(h("<div class='room'>Schon fertig?</div><h2>Bonus: Morsen und erfinden</h2>"));
  var m=h("<div class='q'><div class='qh'>Morse-Rätsel</div><div class='qt'>Entschlüssle das Wort. Es hat mit der Industrialisierung zu tun. (· = kurz, – = lang, Abstand = neuer Buchstabe)</div><div class='morse'>–·· ·– –– ·––· ··–·</div><div class='mtab'><span>A ·–</span><span>D –··</span><span>E ·</span><span>F ··–·</span><span>K –·–</span><span>M ––</span><span>O –––</span><span>P ·––·</span><span>R ·–·</span><span>S ···</span><span>T –</span><span>L ·–··</span></div><input type='text' id='mo' autocomplete='off' aria-label='Lösungswort'> <button class='btn' type='button' id='mok'>Prüfen</button><div class='fb' id='mfb2'></div><p class='small' style='margin-top:12px'>Schaffst du mehr? Schreib deinen Vornamen in Morsezeichen ins Heft und lass ihn von deiner Nachbarin oder deinem Nachbarn entschlüsseln.</p></div>").firstChild;
  app.appendChild(m);
  m.querySelector("#mok").addEventListener("click",function(){var v=m.querySelector("#mo").value.trim().toUpperCase();var f=m.querySelector("#mfb2");f.style.display="block";
    if(v==="DAMPF"){f.className="fb";f.innerHTML="<b>Richtig: DAMPF.</b>Ohne Dampfmaschine keine Fabriken, keine Eisenbahn und keine Telegrafenleitungen entlang der Gleise.";}
    else{f.className="fb bad";f.innerHTML="<b>Noch nicht.</b>Übersetze Zeichen für Zeichen mit der Tabelle.";}});
  app.appendChild(h("<div class='heft' style='margin-top:16px'><p><b>Erfinde selbst (ins Heft):</b> Welches Problem aus deinem Alltag nervt dich? Erfinde eine Maschine dafür.</p><p>1. Zeichne deine Erfindung und beschrifte die Teile.</p><p>2. Schreib eine „Patentanmeldung“: Name der Erfindung · Welches Problem löst sie? · Wie funktioniert sie? · Wem nützt sie, wem könnte sie schaden?</p><p class='small'>Ideen gehen nie aus. Wenn du fertig bist, erfinde eine zweite Maschine oder verbessere die erste.</p></div>"));
  var r=h("<div style='margin-top:18px'><button class='btn ghost' type='button' id='rs'>Neu starten</button><div class='confirm' id='cf'>Wirklich alles löschen und von vorn beginnen? <button class='btn' type='button' id='yes'>Ja, neu starten</button> <button class='btn ghost' type='button' id='no'>Nein</button></div></div>").firstChild;
  app.appendChild(r);
  r.querySelector("#rs").addEventListener("click",function(){r.querySelector("#cf").style.display="block";});
  r.querySelector("#no").addEventListener("click",function(){r.querySelector("#cf").style.display="none";});
  r.querySelector("#yes").addEventListener("click",function(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();});
  nav(true,"Fertig");
  navNext.style.visibility="hidden";
}
function render(){
  app.innerHTML="";navNext=null;
  var st=STEPS[S.step]||STEPS[0];
  if(st.k==="start")pStart();else if(st.k==="ex")pEx(st.i);else if(st.k==="women")pWomen();else if(st.k==="order")pOrder();else if(st.k==="folgen")pFolgen();else if(st.k==="heft")pHeft();else if(st.k==="result")pResult();else pBonus();
  progress();window.scrollTo(0,0);
}
render();
})();
</script>
</body>
</html>
